a Barzani",hint:"سەرکردەی ئەفسانەیی بزووتنەوەی ڕزگاریخوازیی کورد؛ جەنەڕاڵی سوپای کۆماری مەهاباد و ڕێبەری پارتی دیموکرات؛ شۆڕشی ئەیلوولی ١٩٦١ی ڕاگەیاند؛ باوکی مەسعود بارزانی",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Mustafa_Barzani.jpg/440px-Mustafa_Barzani.jpg"},{name:"شێخ عوبەیدوڵڵای نەهری",latin:"Sheikh Ubeydullah Nehri",hint:"سەرکردەی شۆڕشی ١٨٨٠؛ یەکەم بزووتنەوەی سەربەخۆییخوازی نەتەوەیی کورد کە نامەی بۆ باڵیۆزانی ئەوروپا نارد",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Sheikh_Ubeydullah_Nehri.jpg/440px-Sheikh_Ubeydullah_Nehri.jpg"},{name:"بەدرخان بەگ",latin:"Bedirxan Beg",hint:"دوایین میری بۆتان لە جزیرە؛ لە ١٨٤٧ دژی عوسمانی ڕاپەڕی و میرنشینەکەی ڕووخا",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Bedir_Khan_Beg.jpg/440px-Bedir_Khan_Beg.jpg"},{name:"مەستوورەی ئەردەڵان",latin:"Mastura Ardalan",hint:"شاعیر و یەکەم ژنی مێژوونووسی کورد (١٨٠٥–١٨٤٨) لە سنە؛ کتێبی مێژووی ئەردەڵانی نووسی",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Mesture_Erdelan.jpg/440px-Mesture_Erdelan.jpg"},{name:"خانزادی سۆران",latin:"Khanzad",hint:"میرژنی سۆران؛ خوشکی میر محەمەد؛ قەڵای دوێنی لە نزیک هەرێر بە ناویەوەیە؛ نموونەی دەسەڵاتی ژنان لە مێژووی کورد",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Dwin_Castle.jpg/440px-Dwin_Castle.jpg"},{name:"میری کۆرە",latin:"Mir Muhammad of Rawanduz",hint:"میری سۆران (١٨١٣–١٨٣٦)؛ یەکەم کارگەی تۆپ و پارەی کوردیی دروست کرد؛ دەسەڵاتێکی بەهێزی ناوخۆیی بنیات نا",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Mir_Muhammad_of_Rowanduz.jpg/440px-Mir_Muhammad_of_Rowanduz.jpg"},{name:"کەریم خانی زەند",latin:"Karim Khan Zand",hint:"دامەزرێنەری دەوڵەتی زەند لە ئێران (١٧٥١–١٧٧٩)؛ ڕەچەڵەکی لەکی کورد؛ شیرازی کردە پایتەخت و خۆی بە وەکیلی ڕەعیەت ناساند",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Karim_Khan_Zand.jpg/440px-Karim_Khan_Zand.jpg"},{name:"جەلادەت بەدرخان",latin:"Celadet Bedirxan",hint:"زمانناس و میری کورد؛ ئەلفوبێی لاتینی کوردیی داڕشت ١٩٣٢؛ گۆڤاری هاواری دەرکرد",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Celadet_Ali_Bedirxan.jpg/440px-Celadet_Ali_Bedirxan.jpg"},{name:"مەلای جزیری",latin:"Melayê Cizîrî",hint:"گەورەترین شاعیری کلاسیکی سۆفیی کورمانجی لە جزیرەی بۆتان؛ دیوانە شیعرییەکەی شاکاری ئەدەبیاتی کوردییە",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Melaye_Ciziri_Statue.jpg/440px-Melaye_Ciziri_Statue.jpg"},{name:"فەقێ تەیران",latin:"Feqiyê Teyran",hint:"شاعیری کلاسیکی کورمانجی (١٥٩٠–١٦٦٠)؛ شێخی سەنعان و بەیتی زەمبیلفرۆشی نووسی",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Feqiye_Teyran_Tomb.jpg/440px-Feqiye_Teyran_Tomb.jpg"},{name:"عەبدوڵڵا گۆران",latin:"Abdulla Goran",hint:"باوکی شیعری نوێی کوردی (١٩٠٤–١٩٦٢)؛ لە هەڵەبجە؛ کێشی عەرووزی بە کێشی کوردیی گۆڕی",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Goran_kurdish_poet.jpg/440px-Goran_kurdish_poet.jpg"},{name:"ئیبراهیم ئەحمەد",latin:"Ibrahim Ahmad",hint:"نووسەر و سیاسەتمەداری کورد؛ ڕۆمانی ژانی گەل یەکەم ڕۆمانی سیاسیی کوردییە؛ باوکی هێرۆ و خەزووری مام جەلال",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Ibrahim_Ahmad.jpg/440px-Ibrahim_Ahmad.jpg"},{name:"تۆفیق وەهبی",latin:"Tawfiq Wahbi",hint:"ئەفسەر، زمانناس و دیپلۆماتی کوردی سلێمانی؛ لە بیستەکان ئەلفوبێیەکی لاتینی بۆ کوردی پێشنیار کرد؛ نووسەری یەکەم ڕێزمانی کوردی بە ئینگلیزی و دامەزرێنەری کۆمەڵەی هێوا",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Tawfiq_Wahby.jpg/440px-Tawfiq_Wahby.jpg"},{name:"حەسەن زیرەک",latin:"Hasan Zirak",hint:"گۆرانیبێژی نەمری کورد لە بۆکان (١٩٢١–١٩٧٢)؛ زیاتر لە هەزار گۆرانی تۆمار کرد بەبێ ئەوەی نووسین بزانێت",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Hassan_Zirak.jpg/440px-Hassan_Zirak.jpg"},{name:"لەیلا قاسم",latin:"Leyla Qasim",hint:"خوێندکار و چالاکوانی کورد؛ لە ١٩٧٤ لە بەغدا لەلایەن ڕژێمی بەعسەوە لە سێدارە درا؛ سیمبولی خەباتی ژنانی کورد",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Leyla_Qasim.jpg/440px-Leyla_Qasim.jpg"},{name:"عادلە خانم",latin:"Adela Khanum",hint:"میرژنی جاف لە هەڵەبجە؛ بەریتانییەکان بە خاتوونی بەهێز ناویانبرد؛ دادگای خۆی هەبوو",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Lady_Adela_Jaff.jpg/440px-Lady_Adela_Jaff.jpg"},{name:"شەریف پاشا",latin:"Sherif Pasha",hint:"دیپلۆماتی کورد؛ لە کۆنفرانسی ئاشتیی پاریس ١٩١٩ نەخشەی کوردستانی پێشکەش کرد وەک نوێنەری کورد",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/%C5%9Eerif_Pa%C5%9Fa.jpg/440px-%C5%9Eerif_Pa%C5%9Fa.jpg"},{name:"عەلی مەردان",latin:"Ali Mardan",hint:"گۆرانیبێژی گەورەی مەقامی کوردی لە کەرکووک؛ یەکێک لە بنچینەدانەرانی مۆسیقای کلاسیکی کوردی",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Ali_Mardan.jpg/440px-Ali_Mardan.jpg"},{name:"مامۆستا هەژار",latin:"Hejar Mukriyani",hint:"گەورە زمانناس و وەرگێڕی کورد (١٩٢١–١٩٩٠)؛ قورئان و شەرەفنامە و مەم و زینی وەرگێڕاوەتە سەر سۆرانی؛ خاوەنی فەرهەنگی گەورەی «هەنبانە بۆرینە»",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Hejar.jpg/440px-Hejar.jpg"},{name:"مامۆستا هێمن",latin:"Hemin Mukriyani",hint:"شاعیری گەورەی مەهاباد (١٩٢١–١٩٨٦)؛ شاعیری کۆماری کوردستان؛ لە ١٩٤٤ ڕۆژنامەی «هەڵپەڕکێ»ی دەرکرد؛ دیوانە شیعرەکانی لە ڕۆژهەڵاتی کوردستان بەناوبانگن",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Hemin_Mukriyani.jpg/440px-Hemin_Mukriyani.jpg"},{name:"دکتۆر قاسملوو",latin:"Abdul Rahman Ghassemlou",hint:"سکرتێری گشتیی حیزبی دیموکراتی کوردستانی ئێران؛ دکتۆرای ئابووری لە پڕاگ؛ لە ١٩٨٩ لە ڤیەننا لە کاتی دانوستان لەلایەن ئێرانەوە تیرۆرکرا",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Abdul_Rahman_Ghassemlou.jpg/440px-Abdul_Rahman_Ghassemlou.jpg"},{name:"سەید ڕەزای دەرسیم",latin:"Seyid Riza",hint:"سەرکردەی ڕاپەڕینی دەرسیم ١٩٣٧–١٩٣٨ دژی دەوڵەتی تورکیا؛ لە ئەلەزیز لە سێدارە درا",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Seyid_Riza.jpg/440px-Seyid_Riza.jpg"},{name:"شێخ ڕەزای تاڵەبانی",latin:"Sheikh Riza Talabani",hint:"شاعیری تانزی کورد (١٨٣٥–١٩١٠)؛ بە شیعری گاڵتەجاڕ و ڕەخنەی توندی سیاسی ناسراوە",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Sheikh_Riza_Talabani.jpg/440px-Sheikh_Riza_Talabani.jpg"},{name:"جگەرخوێن",latin:"Cegerxwîn",hint:"شاعیری گەورەی کورمانج (١٩٠٣–١٩٨٤)؛ هەشت دیوانی شیعری؛ شاعیری نەتەوایەتی و چەپ",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Cigerxwin.jpg/440px-Cigerxwin.jpg"},{name:"کاک ئەحمەدی شێخ",latin:"Kak Ahmad Sheikh",hint:"زانا و شاعیر و وتێبی مزگەوتی گەورەی سلێمانی؛ حوجرەکانی چاک کرد و وانەی بە کوردی گوتەوە؛ کتێبی «ئەحمەدی»ی بۆ فێربوونی زمانی عەرەبی نووسی؛ کوڕی شێخ مارفی نۆدێ",difficulty:"hard"},{name:"ئیدریس بارزانی",latin:"Idris Barzani",hint:"کوڕی مەلا مستەفا بارزانی و سەرکردەی پارتی دوای ١٩٧٩؛ باوکی نێچیرڤان بارزانی؛ لە ١٩٨٧ کۆچی دوایی کرد",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Idris_Barzani.jpg/440px-Idris_Barzani.jpg"},{name:"کاوەی ئاسنگەر",latin:"Kawa the Blacksmith",hint:"پاڵەوانی ئەفسانەی نەورۆز؛ ئاسنگەرێک کە زوحاکی زۆردار کوشت و ئاگری سەرکەوتنی هەڵکرد",difficulty:"easy"},{name:"زوحاک",latin:"Zahhak",hint:"پاشای زۆردار لە ئەفسانەی نەورۆز؛ دوو ماری لەسەر شانی بوو کە بە مێشکی گەنجان دەخوردن",difficulty:"easy"},{name:"دیاکۆ",latin:"Deioces",hint:"یەکەم پاشای ماد (٧٢٨–٦٧٥ پ.ز)؛ هۆزە مادییەکانی یەکخست و شاری هەگمەتانەی کردە پایتەخت",difficulty:"medium"},{name:"کیەخسەرۆی ماد",latin:"Cyaxares",hint:"پاشای ماد؛ لە ٦١٢ پ.ز لەگەڵ بابلییەکان نەینەوا، پایتەختی ئاشوورییەکانی ڕووخاند",difficulty:"hard"},{name:"ئەستیاگ",latin:"Astyages",hint:"دوایین پاشای ماد؛ لە ٥٥٠ پ.ز لەلایەن نەوەکەی کۆرشی مەزنەوە دەسەڵاتی لەدەست دا",difficulty:"hard"},{name:"زەرادەشت",latin:"Zoroaster",hint:"پێغەمبەری کۆنی ئێرانی و دامەزرێنەری ئایینی زەرادەشتی؛ کتێبی ئاڤێستا؛ بیرۆکەی تێکۆشانی چاک و خراپ و باوەڕی بە ئەهورامەزدا",difficulty:"medium"},{name:"شەرەفخانی بەدلیسی",latin:"Sharafkhan Bitlisi",hint:"میر و مێژوونووسی کورد؛ لە ١٥٩٧ شەرەفنامەی نووسی، یەکەم مێژووی گشتیی میرنشینەکانی کورد",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Sharafkhan_Bitlisi.jpg/440px-Sharafkhan_Bitlisi.jpg"},{name:"ئەبوو حەنیفەی دینەوەری",latin:"Dinawari",hint:"زانا و ڕووەکناسی گەورەی کورد لە سەدەی ٩؛ کتێبی ڕووەک (کتاب النبات)؛ ئەستێرەناس و بیرکار",difficulty:"hard"},{name:"شەهابەدینی سەهرەوەردی",latin:"Suhrawardi",hint:"فەیلەسووفی کورد لە سەهرەوەرد (١١٥٤–١١٩١)؛ دامەزرێنەری فەلسەفەی ئیشراق؛ کتێبی حیکمەتول ئیشراق؛ لە حەلەب لە سێدارە درا",difficulty:"hard"},{name:"ئیسماعیلی جەزەری",latin:"Al-Jazari",hint:"ئەندازیار و داهێنەری کورد لە جزیرە (١١٣٦–١٢٠٦)؛ کتێبی ئامێرە زیرەکەکان؛ باوکی ڕۆبۆتیک",difficulty:"medium"},{name:"ئیبن ئەسیر",latin:"Ibn al-Athir",hint:"مێژوونووسی کورد لە جزیرەی بۆتان؛ کتێبی ئەلکامیل فی التاریخ، یەکێک لە گرنگترین سەرچاوەکانی مێژووی ئیسلامی",difficulty:"hard"},{name:"ئیبن خەللیکان",latin:"Ibn Khallikan",hint:"ژیاننامەنووسی کورد لە هەولێر (١٢١١–١٢٨٢)؛ کتێبی وفیات الأعیان، گرنگترین فەرهەنگی ژیاننامەی ئیسلامی",difficulty:"hard"},{name:"شێرکۆی ئەیوبی",latin:"Shirkuh",hint:"مامی سەلاحەدینی ئەیوبی و فەرماندەی کورد؛ میسری گرت و ڕێگای بۆ دەسەڵاتی ئەیوبییەکان خۆشکرد",difficulty:"hard"},{name:"سەعیدی نوورسی",latin:"Said Nursi",hint:"زانای کورد لە بدلیس (١٨٧٧–١٩٦٠)؛ کۆمەڵەی ڕەسائیل نووری نووسی؛ بزووتنەوەی نوورجی بە ناویەوەیە",difficulty:"medium"},{name:"مەولانا خالیدی نەقشبەندی",latin:"Mawlana Khalid",hint:"ڕابەری تەریقەتی نەقشبەندیی موجەدیدی؛ ڕێبازی خالیدیی لە ڕۆژهەڵاتی ناوەڕاست بڵاوکردەوە",difficulty:"medium"},{name:"مەلا ئەفەندی",latin:"Mulla Effendi",hint:"زانا، فەلەکزان و مامۆستای ئایینی هەولێر (١٨٦٣–١٩٤٢)؛ وانەی لە مزگەوتی گەورەی قەڵای هەولێر وتەوە و نیشانی یەکەمی عوسمانی پێبەخشرا",difficulty:"medium"},{name:"دیلدار",latin:"Dildar",hint:"شاعیری کورد لە کۆیە (١٩١٨–١٩٤٨)؛ سرودی ئەی ڕەقیبی نووسی کە بووە سرودی نەتەوەیی کورد",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Dildar.jpg/440px-Dildar.jpg"},{name:"فایەق بێکەس",latin:"Faiq Bekas",hint:"شاعیری سلێمانی (١٩٠٥–١٩٤٨)؛ شاعیری هەژاران و باوکی شێرکۆ بێکەس",difficulty:"medium"},{name:"سالم",latin:"Salim",hint:"شاعیری کلاسیکی سۆرانی (١٨٠٠–١٨٦٦)؛ برای شاعیر کوردی؛ یەکێکە لە ستوونەکانی شیعری سەردەمی بابان؛ شیعرە ئایینی و خۆشەویستییەکانی جێی باسن",difficulty:"medium"},{name:"کوردی",latin:"Kurdi",hint:"شاعیری کلاسیکی سۆرانی (١٨١٢–١٨٥٠)؛ برای سالم؛ یەکێکە لە سێ گەورەکەی شیعری کلاسیکی سۆرانی لە سەردەمی بابان لەگەڵ نالی و سالم",difficulty:"hard"},{name:"وەفایی",latin:"Wafaei",hint:"شاعیری گەورەی کلاسیکی سۆرانی لە سەدەی نۆزدەیەم؛ شیعرە خۆشەویستی و عیرفانییەکانی ناوبانگیان هەیە؛ یەکێکە لە گەورەکانی ئەدەبیاتی کوردیی ئەردەڵان",difficulty:"hard"},{name:"محەمەد ئەمین زەکی بەگ",latin:"Amin Zaki Bey",hint:"مێژوونووس و وەزیری کورد لە بەغدا؛ کتێبی خولاسەیەکی تاریخی کورد و کوردستان بە یەکەم مێژووی زانستیی کورد دادەنرێت",difficulty:"hard"},{name:"عەلائەدین سەجادی",latin:"Aladdin Sajadi",hint:"مێژوونووسی ئەدەبی کوردی؛ کتێبی مێژووی ئەدەبی کوردیی نووسی کە سەرچاوەیەکی بنەڕەتییە",difficulty:"hard"},{name:"خانای قوبادی",latin:"Khanay Qubadi",hint:"شاعیری گەورەی زاراوەی گۆرانی (١٧٠٠–١٧٥٩)؛ داستانی شیرین و خەسرەوی بە کوردی نووسییەوە",difficulty:"hard"},{name:"مەولەوی تاوەگۆزی",latin:"Mawlavi Tawagozi",hint:"شاعیری سۆفیی گۆرانی (١٨٠٦–١٨٨٢)؛ گەورەترین شاعیری هەورامی؛ دیوانێکی گەورەی هەیە",difficulty:"hard"},{name:"مەحمود خانی کەلهوڕ",latin:"Mahmoud Khan Kalhor",hint:"میر و شاعیری بەناوبانگی کورد لە کرماشان؛ بە زاراوەی کەلهوڕی شیعری عیرفانی و نەتەوەیی نووسیوە",difficulty:"hard"},{name:"ئیبراهیم پاشای بابان",latin:"Ibrahim Pasha Baban",hint:"میری بابان؛ لە ١٧٨٤ شاری سلێمانیی دامەزراند و کردییە پایتەختی میرنشینەکە",difficulty:"medium"},{name:"ئەحمەد پاشای بابان",latin:"Ahmad Pasha Baban",hint:"دوایین میری بابان؛ لە شەڕی چوارتای ١٨٤٧ دژی عوسمانییەکان دۆڕا و لە ١٨٥٠ میرنشینەکەی کۆتایی هات",difficulty:"hard"},{name:"عەبدولڕەحمان پاشای بابان",latin:"Abdurrahman Pasha Baban",hint:"میری بابان لە سەرەتای سەدەی ١٩؛ لە سەردەمی ئەودا میرنشینەکە لە لووتکەی هێز و شکۆدا بوو",difficulty:"hard"},{name:"مقداد میدحات بەدرخان",latin:"Mikdad Midhat Bedirxan",hint:"ڕۆژنامەنووسی کورد؛ لە ٢٢ی نیسانی ١٨٩٨ یەکەم ڕۆژنامەی کوردی (کوردستان)ی لە قاهیرە دەرکرد",difficulty:"medium"},{name:"سووریا بەدرخان",latin:"Sureyya Bedirxan",hint:"ڕۆژنامەنووس و سەرکردەی کۆمەڵەی سەربەخۆیی کورد؛ گۆڤاری ڕۆژی کوردی لە قاهیرە و ئەستەمبوڵ دەرکرد",difficulty:"hard"},{name:"کامران بەدرخان",latin:"Kamuran Bedirxan",hint:"زمانناس و دیپلۆماتی کورد؛ برای جەلادەت؛ لە پەیمانگای نەتەوەییی زمانە ڕۆژهەڵاتییەکانی پاریس (INALCO) زمانی کوردیی وتەوە",difficulty:"hard"},{name:"شێخ عەبدولسەلام بارزانی",latin:"Sheikh Abdul Salam Barzani",hint:"سەرکردەی بارزان و برای گەورەی مەلا مستەفا؛ لە ١٩١٤ لەلایەن عوسمانییەکانەوە لە موسڵ لە سێدارە درا",difficulty:"hard"},{name:"شێخ ئەحمەدی بارزانی",latin:"Sheikh Ahmad Barzani",hint:"ڕابەری ڕۆحی بارزان و برای مەلا مستەفا؛ ڕاپەڕینی ١٩٣١–١٩٣٢ی سەرکردایەتی کرد",difficulty:"medium"},{name:"جەعفەر ئاغای شکاک",latin:"Jafar Agha Shikak",hint:"سەرۆک هۆزی شکاک و برای گەورەی سمکۆ؛ لە ١٩٠٥ لەلایەن والی تەبرێزەوە بە فێڵ بانگکرا و شەهید کرا",difficulty:"hard"},{name:"ئیحسان نوری پاشا",latin:"Ihsan Nuri Pasha",hint:"ئەفسەری کورد و فەرماندەی گشتیی ڕاپەڕینی ئاگری ١٩٢٧–١٩٣٠؛ کۆماری ئاراراتی بەرگری کرد",difficulty:"hard"},{name:"بروێ حەسکی تێلی",latin:"Broyê Heskî Têlî",hint:"فەرماندەی ناودار لە ڕاپەڕینی ئاگری؛ لە ئەفسانەکانی بەرخودانی کوردی باکوور",difficulty:"hard"},{name:"عەلیشێر",latin:"Ali Sher",hint:"ڕابەری کورد لە ڕاپەڕینی قۆچگیری ١٩٢١ و دەرسیم؛ لەگەڵ هاوسەرەکەی زەریفە کوژرا",difficulty:"hard"},{name:"زاریفە",latin:"Zarife",hint:"ژنە پاڵەوانی دەرسیم و هاوسەری عەلیشێر؛ چەکدارانە بەشداریی ڕاپەڕینی کرد",difficulty:"hard"},{name:"هاجۆ ئاغا",latin:"Hajo Agha",hint:"سەرۆک هۆزی هەڤێرکان و یەکێک لە دامەزرێنەرانی کۆمەڵەی خۆیبوون؛ ڕاپەڕینی ئاگری پشتیوانی کرد",difficulty:"hard"},{name:"مەمدوح سەلیم",latin:"Memduh Selim",hint:"ڕۆشنبیر و یەکێک لە دامەزرێنەرانی خۆیبوون؛ لە پلاندانانی ڕاپەڕینی ئاگری ڕۆڵی گرنگی بینی",difficulty:"hard"},{name:"ئەکرەم جەمیل پاشا",latin:"Ekrem Cemilpasha",hint:"چالاکوان و نووسەری کورد لە دیاربەکر؛ یەکێک لە دامەزرێنەرانی کۆمەڵەکانی کوردی لە سەدەی بیستەم",difficulty:"hard"},{name:"قەدری جەمیل پاشا",latin:"Qadri Cemilpasha",hint:"نووسەر و چالاکوانی کورد؛ برای ئەکرەم؛ بیرەوەرییەکانی سەرچاوەی مێژووی کوردی باکوورن",difficulty:"hard"},{name:"عوسمان سەبری",latin:"Osman Sabri",hint:"شاعیر و چالاکوانی کورد لە ڕۆژئاڤا؛ نازناوی ئاپۆ عوسمان؛ یەکێک لە دامەزرێنەرانی پارتی دیموکراتی کوردی سوریا",difficulty:"hard"},{name:"قەدریجان",latin:"Qadrîjan",hint:"شاعیری کورمانج لە ڕۆژئاڤا؛ لە گۆڤاری هاوار و ڕۆناهی شیعری بڵاوکردەوە",difficulty:"hard"},{name:"مەحمەد ئوزون",latin:"Mehmed Uzun",hint:"دامەزرێنەری ڕۆمانی نوێی کورمانجی (١٩٥٣–٢٠٠٧)؛ حەوت ڕۆمانی نووسی؛ ساڵانێکی زۆر لە سوید بوو",difficulty:"hard"},{name:"عەرەبی شەمۆ",latin:"Erebê Şemo",hint:"یەکەم ڕۆماننووسی کورد؛ لە ١٩٣٥ ڕۆمانی شڤانێ کوردی لە یەکێتیی سۆڤیەت بڵاوکردەوە",difficulty:"hard"},{name:"ئەمینێ ئەڤدال",latin:"Eminê Evdal",hint:"نووسەر و فۆلکلۆرناسی کوردی ئێزیدی لە ئەرمەنیا؛ لە پاراستنی ئەدەبی فۆلکلۆریی کوردی ڕۆڵی گێڕا",difficulty:"hard"},{name:"حاجیێ جندی",latin:"Haciyê Cindî",hint:"زمانناس و فۆلکلۆرناسی کورد لە ئەرمەنیا؛ کۆکردنەوەی بەیت و چیرۆکی گەلیی کوردی",difficulty:"hard"},{name:"ئۆردیخانێ جەلیل",latin:"Ordîxanê Celîl",hint:"کوردناس و فۆلکلۆرناس لە یەریڤان؛ لەگەڵ براکەی هەزاران گۆرانی و چیرۆکی گەلیی کوردی تۆمار کرد",difficulty:"hard"},{name:"جەلیلێ جەلیل",latin:"Celîlê Celîl",hint:"مێژوونووس و کوردناسی کورد لە ئەرمەنیا؛ لێکۆڵینەوەی بەنرخ لەسەر مێژووی نوێی کورد",difficulty:"hard"},{name:"جاسمێ جەلیل",latin:"Casimê Celîl",hint:"نووسەر و ڕاگەیاندکاری کورد لە یەریڤان؛ بەرنامەی ڕادیۆی کوردیی ئەرمەنستانی بەڕێوەبرد",difficulty:"hard"},{name:"وەزیری نادری",latin:"Wezîrê Nadirî",hint:"شاعیر و شانۆنووسی ئێزیدی لە ئەرمەنیا؛ یەکێکە لە دامەزرێنەرانی ئەدەبیاتی نوێی ئێزیدی؛ شانۆگەری «ڕەڤا جین»ی نووسی؛ لە تەمەنێکی گەنجیدا کۆچی دوایی کرد",difficulty:"hard"},{name:"سەدر قازی",latin:"Sadr Qazi",hint:"برای قازی محەمەد و یەکێک لە سەرکردەکانی کۆماری مەهاباد؛ لە ٣١ی ئازاری ١٩٤٧ لە چوارچرا لەگەڵ قازی لە سێدارە درا",difficulty:"hard"},{name:"سەید عەبدولقادری نەهری",latin:"Seyid Abdulkadir Nehri",hint:"کوڕی شێخ عوبەیدوڵڵا و سەرۆکی کۆمەڵەی تەعالی کوردستان؛ لە ١٩٢٥ لە سێدارە درا",difficulty:"hard"},{name:"نووری دەرسیمی",latin:"Nuri Dersimi",hint:"دکتۆری ڤێتێرنەری و نووسەری مێژووی دەرسیم؛ بەشداری لە ڕاپەڕینی قۆچگیری و دەرسیم کرد و لە حەلەب کۆچی دوایی کرد",difficulty:"hard"},{name:"عەبدوڵڵا جەودەت",latin:"Abdullah Cevdet",hint:"پزیشک، بیرمەند و وەرگێڕی کورد؛ لە دامەزرێنەرانی جەمعیەتی ئیتیحاد و تەرەقی؛ شانۆنامەکانی شێکسپیری وەرگێڕا",difficulty:"hard"},{name:"سەیفی قازی",latin:"Saif Qazi",hint:"محەمەد حوسێن سەیفی قازی، ئامۆزای پێشەوا قازی؛ وەزیری جەنگ و فەرماندەی گشتیی هێزی پێشمەرگەی کۆماری مەهاباد",difficulty:"hard"},{name:"مەلا پەرێشان",latin:"Mala Parêshan",hint:"شاعیری گەورەی کورد لە سەدەی ١٤ لە دینەوەر؛ دیوانی مەلا پەرێشان کۆنترین شاکاری شیعرە بە زاراوەی گۆرانی/لەکی",difficulty:"hard"},{name:"بێسارانی",latin:"Bêseranî",hint:"مەلا مستەفای بێسارانی (١٦٤٢–١٧٠١)؛ شاعیری سۆفیی گۆرانی/هەورامی لە دێی بێسارانی سەوڵاوا؛ دیوانەکەی کاریگەریی لەسەر مەولەوی تاوەگۆزی هەبوو",difficulty:"hard"},{name:"عەلی ئەسغەری کوردستانی",latin:"Ali Asghar Kurdistani",hint:"گەورەترین گۆرانیبێژی مەقامی کلاسیکی کورد لە سەرەتای سەدەی بیستەم لە سنە؛ دەیان پارچەی مەقامی لە تاران تۆمار کرد کە ئێستاش شاکاری مۆسیقای کوردین",difficulty:"hard"},{name:"شێخ مارفی نۆدێ",latin:"Sheikh Maruf Nodoushan",hint:"زانا و مامۆستای گەورەی نەقشبەندی لە سلێمانی؛ حوجرەکەی ناوبانگی هەبوو و زانایانی لێ دەرچوون؛ کوڕەکەی کاک ئەحمەدی شێخ شوێنی گرتەوە",difficulty:"hard"},{name:"ئیبن سەلاح",latin:"Ibn al-Salah",hint:"ئیبن سەلاحی شارەزووری (١١٨١–١٢٤٥)؛ زانای گەور y"},{name:"ئێدن هازارد",latin:"Eden Hazard",hint:"بەلجیکا؛ باشترین یاریزانی چێلسی لە دەیەی ٢٠١٠؛ لە ڕیاڵ مەدرید بەهۆی برینەوە سەرنەکەوت",difficulty:"easy"},{name:"ئاندرێا پیرلۆ",latin:"Andrea Pirlo",hint:"ئیتاڵیا؛ مایسترۆی ناوەڕاست؛ جامی جیهانیی ٢٠٠٦؛ تۆپە ئازاد و پاسە درێژەکانی ئەفسانەیین",difficulty:"easy"},{name:"فرانچێسکۆ تۆتی",latin:"Francesco Totti",hint:"ئیتاڵیا؛ ٢٥ ساڵ تەنها بۆ ڕۆما یاریی کرد؛ نازناوی پاشای ڕۆما؛ جامی جیهانیی ٢٠٠٦",difficulty:"medium"},{name:"یۆهان کرۆیف",latin:"Johan Cruyff",hint:"هۆڵەندا؛ داهێنەری چەمکی تۆپی پێی گشتگیر؛ گەرانەوەی کرۆیف؛ وەک ڕاهێنەر بارسێلۆنای گۆڕی",difficulty:"medium"},{name:"فرانتس بێکنباوەر",latin:"Franz Beckenbauer",hint:"ئەڵمانیا؛ نازناوی قەیسەر؛ وەک یاریزان (١٩٧٤) و ڕاهێنەر (١٩٩٠) جامی جیهانیی بردەوە؛ داهێنەری ڕۆڵی لیبەرۆ",difficulty:"medium"},{name:"کارلێس پویۆل",latin:"Carles Puyol",hint:"ئیسپانیا؛ کاپتنی بەرگریی بارسێلۆنا و ئیسپانیا؛ جامی جیهانیی ٢٠١٠؛ قژە درێژەکەی نیشانەی بوو",difficulty:"easy"},{name:"تیبۆ کۆرتوا",latin:"Thibaut Courtois",hint:"بەلجیکا؛ گۆڵپارێزی ڕیاڵ مەدرید؛ لە کۆتاییی چامپیۆنزلیگی ٢٠٢٢ نۆ پاراستنی کرد و جامی بردەوە",difficulty:"medium"},{name:"ڕیاز مەحرەز",latin:"Riyad Mahrez",hint:"جەزائیر؛ لەگەڵ لێستەر سیتی موعجیزەی پرێمیەرلیگی ٢٠١٦؛ باشترین یاریزانی ساڵ؛ دواتر مانچستەر سیتی",difficulty:"medium"},{name:"ئەشرەف حەکیمی",latin:"Achraf Hakimi",hint:"مەغریب؛ بەرگریی ڕاستی پاریس سان جێرمان؛ لە جامی جیهانیی ٢٠٢٢ مەغریب گەیشتە یەکەم چوارەکەی ئەفریقا",difficulty:"easy"},{name:"ڕۆنالدۆ نازاریۆ",latin:"Ronaldo Nazário",hint:"بەرازیل؛ ڕۆناڵدۆی ڕەسەن؛ دوو تۆپی زێڕین؛ ٨ گۆڵ لە جامی جیهانیی ٢٠٠٢؛ لە برینی قورس گەڕایەوە",difficulty:"easy"},{name:"ڕۆبێرتۆ باجیۆ",latin:"Roberto Baggio",hint:"ئیتاڵیا؛ نازناوی گیسکی ئیلاهی؛ پەناڵتییەکەی لە کۆتاییی ١٩٩٤ لە دەست دا؛ تۆپی زێڕینی ١٩٩٣",difficulty:"medium"},{name:"کۆڵ پاڵمەر",latin:"Cole Palmer",hint:"ئینگلتەرا؛ ئەستێرەی چێلسی؛ ئاهەنگی سەرما دوای گۆڵ؛ لە مانچستەر سیتییەوە هات",difficulty:"medium"},{name:"ڕۆدری",latin:"Rodri",hint:"ئیسپانیا؛ تۆپی زێڕینی ٢٠٢٤؛ گۆڵی کۆت  sudden fever and body aches, annual vaccination",difficulty:"easy"},{name:"COVID-19",latin:"",hint:"SARS-CoV-2 coronavirus, global pandemic of 2020, loss of smell and taste",difficulty:"easy"},{name:"HIV/AIDS",latin:"",hint:"Retrovirus that depletes CD4 T-cells, opportunistic infections, antiretroviral therapy",difficulty:"easy"},{name:"Hepatitis B",latin:"",hint:"DNA virus, blood and sexual transmission, preventable by vaccine, can cause cirrhosis",difficulty:"easy"},{name:"Hepatitis C",latin:"",hint:"RNA virus, blood-borne, now curable with direct-acting antivirals",difficulty:"medium"},{name:"Hepatitis A",latin:"",hint:"Picornavirus, fecal-oral transmission, self-limiting, no chronic carrier state",difficulty:"medium"},{name:"Tuberculosis",latin:"",hint:"Mycobacterium tuberculosis, chronic cough, night sweats, weight loss, acid-fast bacilli",difficulty:"easy"},{name:"Malaria",latin:"",hint:"Plasmodium parasite via female Anopheles mosquito, cyclic fever with rigors",difficulty:"easy"},{name:"Cholera",latin:"",hint:"Vibrio cholerae, profuse rice-water diarrhea, severe dehydration, fecal-oral",difficulty:"easy"},{name:"Typhoid Fever",latin:"",hint:"Salmonella typhi, stepwise fever, rose spots on abdomen, relative bradycardia",difficulty:"medium"},{name:"Brucellosis",latin:"",hint:"Undulant fever, unpasteurized dairy, zoonosis from cattle, goats, and sheep",difficulty:"medium"},{name:"Leishmaniasis",latin:"",hint:"Protozoan Leishmania via sandfly, Baghdad boil is the cutaneous form",difficulty:"medium"},{name:"Rabies",latin:"",hint:"Lyssavirus from dog bite, hydrophobia, 100% fatal once symptomatic",difficulty:"easy"},{name:"Tetanus",latin:"",hint:"Clostridium tetani, muscle rigidity, trismus, risus sardonicus, opisthotonus",difficulty:"easy"},{name:"Diphtheria",latin:"",hint:"Corynebacterium diphtheriae, gray pseudomembrane in throat, DPT vaccine",difficulty:"medium"},{name:"Pertussis",latin:"",hint:"Bordetella pertussis, paroxysmal cough with inspiratory whoop, 1
