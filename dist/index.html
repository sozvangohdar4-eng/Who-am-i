fficulty:"easy"},{name:"مووسا",latin:"Moses",hint:"پێغەمبەرێکی سەرەکی لە جوولەکەیی، مەسیحییەت و ئیسلام؛ بەپێی دەقە ئایینییەکان بنی‌ئیسرائیلی لە میسر دەرکرد و دە فەرمانەکەی لە چیای سینا وەرگرت",difficulty:"medium"},{name:"گاوتاما بودا",latin:"Gautama Buddha",hint:"سیدهارتا گاوتاما، دامەزرێنەری بۆدیزم؛ بەپێی نەریت لە لومبینیی نێپالی ئێستا لەدایک بوو و ژیانی دەوڵەمەندیی بەجێهێشت؛ فێرکاریی چوار ڕاستیی پیرۆز و ڕێگای ناوەڕاست",difficulty:"medium"},{name:"کۆنفۆشیۆس",latin:"Confucius",hint:"فەیلەسووف و مامۆستای چینی (٥٥١–٤٧٩ پ.ز)؛ دانا و ڕێبەری ڕەوشت و پەرەپێدانی ڕێزی بنەماڵە و دەوڵەت؛ فەلسەفەکەی بناغەی کولتووری ڕۆژهەڵاتی ئاسیایە",difficulty:"medium"},{name:"سوقرات",latin:"Socrates",hint:"فەیلەسووفی یۆنانی کۆن (نزیکەی ٤٧٠–٣٩٩ پ.ز)؛ بە پرسیار و گفتوگۆ شێوازی سوقراتیی پەرەپێدا؛ دادگای ئەسینا بە مردن حوکمی دا و ژەهری شۆکرانی خوارد",difficulty:"easy"},{name:"ئەفلاتوون",latin:"Plato",hint:"فەیلەسووفی یۆنانی، خوێندکاری سوقرات و مامۆستای ئەرەستوو؛ ئەکادیمیای لە ئەسینا دامەزراند و گفتوگۆی کۆمار و بیردۆزی فۆرمەکانی نووسی",difficulty:"easy"},{name:"ئەرەستوو",latin:"Aristotle",hint:"فەیلەسووف و زانای یۆنانی (٣٨٤–٣٢٢ پ.ز)؛ خوێندکاری ئەفلاتوون و مامۆستای ئەسکەندەری مەزن؛ باوکی مەنتیق، زیندەزانی و زانستە سروشتییەکان",difficulty:"easy"},{name:"ئەسکەندەری مەزن",latin:"Alexander the Great",hint:"پاشای مەقدۆنیا (٣٣٦–٣٢٣ پ.ز)؛ ئیمپراتۆریەتی فارسی هەخامەنشیی ڕووخاند و دەسەڵاتی تا باکووری ڕۆژئاوای هیندستان فراوان کرد؛ لە هیچ جەنگێکی تۆمارکراودا نەدۆڕا",difficulty:"easy"},{name:"یۆلیۆس قەیسەر",latin:"Julius Caesar",hint:"ژەنەڕاڵ، مێژوونووس و دیکتاتۆری کۆماری ڕۆم؛ فەڕەنسای کۆنی گرت؛ لە پیلانگێڕیی ١٥ی ئازاری ٤٤ پ.ز لە ئەنجومەنی پیران تیرۆرکرا",difficulty:"easy"},{name:"ئۆگوستۆس",latin:"Augustus",hint:"یەکەم ئیمپراتۆری ڕۆم (٢٧ پ.ز–١٤ ز) و میراتگری یۆلیۆس قەیسەر؛ دوای جەنگە ناوخۆییەکان دەسەڵاتی جێگیر کرد و سەردەمی Pax Romana دەستی پێکرد",difficulty:"hard"},{name:"کلیۆپاترای حەوتەم",latin:"Cleopatra VII",hint:"دوایین فەرمانڕەوای چالاکی شانشینی بەتڵیمۆسیی میسر؛ بە ڕەچەڵەک یۆنانی-مەقدۆنی بوو و هاوپەیمانی یۆلیۆس قەیسەر و مارک ئەنتۆنی بوو؛ دوای دۆڕان لە ئۆکتاڤیان خۆی کوشت",difficulty:"medium"},{name:"ڕامسی دووەم",latin:"Ramesses II",hint:"فیرعەوەنی شانشینی نۆزدەیەمی میسر (نزیکەی ١٢٧٩–١٢١٣ پ.ز)؛ جەنگی قادش و یەکێک لە کۆنترین پەیماننامە ئاشتییە ماوەکان لەگەڵ حیتییەکان؛ پەرستگاکانی ئەبووسمبڵ",difficulty:"medium"},{name:"توت عەنخ ئاموون",latin:"Tutankhamun",hint:"فیرعەوەنی گەنجی میسری کۆن؛ بە ژیانی کورتەکەی نەک بە دەسکەوتی سیاسی، بەڵکو بە گۆڕە نزیکەی تەواوەکە و دەمامکە زێڕینەکەی ناسراوە کە هاوارد کارتەر لە ١٩٢٢ دۆزییەوە",difficulty:"medium"},{name:"حاموورابی",latin:"Hammurabi",hint:"شەشەمین پاشای شانشینی یەکەمی بابل (نزیکەی ١٧٩٢–١٧٥٠ پ.ز)؛ دەسەڵاتی بابل فراوان کرد و کۆدە یاساییەکەی لەسەر ستێلەیەکی بەردین تۆمار کرا، یەکێک لە تەواوترین یاسا ماوەکانی دنیای کۆن",difficulty:"hard"},{name:"کۆرشی مەزن",latin:"Cyrus the Great",hint:"دامەزرێنەری ئیمپراتۆریەتی هەخامەنشی لە نزیکەی ٥٥٠ پ.ز؛ بە داگیرکردنی بابل و ڕێگەدان بە گەڕانەوەی هەندێک گەلی ڕاگوێزراو ناسراوە؛ لوولەی کۆرش بەڵگەی فەرمانی بابلیی ئەوە",difficulty:"medium"},{name:"داریۆشی یەکەم",latin:"Darius I",hint:"پاشای هەخامەنشی (٥٢٢–٤٨٦ پ.ز)؛ ئیدارەی ساتراپیی ڕێکخست، ڕێگای شاهانەی فراوان و باشتر کرد و پارەی داریک جێگیر کرد؛ نووسراوەی بێستوون دەسەڵاتگرتنەکەی تۆمار دەکات",difficulty:"hard"},{name:"هانیباڵ",latin:"Hannibal",hint:"فەرماندەی کارتاژی؛ یەکێک لە گەورەترین سەربازە مێژووییەکان؛ بە فیلەکانی سوپاکەیەوە بە چیای ئەلپدا پەڕییەوە و لە کانا ڕۆمای بە سەختی بەزاند",difficulty:"medium"},{name:"سپارتاکۆس",latin:"Spartacus",hint:"گلادیاتۆری تراکی لە ڕۆمای کۆن؛ ڕابەری گەورەترین شۆڕشی کۆیلەکان بوو دژی کۆماری ڕۆم (٧٣–٧١ پ.ز)",difficulty:"hard"},{name:"قوستەنتینی مەزن",latin:"Constantine the Great",hint:"ئیمپراتۆری ڕۆم (٣٠٦–٣٣٧ ز)؛ فرمانی میلان لە ٣١٣ ئازادیی پەرستنی مەسیحییەت دابین کرد؛ بیزانتیۆمی وەک قوستەنتینییە نوێکردەوە و پایتەختی کرد",difficulty:"hard"},{name:"چین شی هوانگ",latin:"Qin Shi Huang",hint:"یەکەم ئیمپراتۆری چینی یەکگرتوو (٢٢١–٢١٠ پ.ز)؛ نووسین، کێش و پارەی یەکخست؛ دیوارە کۆنەکانی پێکەوە بەست و گۆڕە گەورەکەی بە سوپای تێراکۆتا پارێزراوە",difficulty:"medium"},{name:"سون تزو",latin:"Sun Tzu",hint:"سەردار و ستراتیژیستی چینی؛ نووسەری کتێبی هونەری جەنگ کە تا ئێستا لە سوپا و بازرگانیدا دەخوێنرێتەوە",difficulty:"medium"},{name:"لائۆ تزو",latin:"Laozi",hint:"فەیلەسووفێکی نەریتیی چین و کەسایەتییەکی نیمچە ئەفسانەیی؛ کتێبی تائۆ تێ چینگ بە نەریت بەو دەدرێتەوە و فێرکارییەکانی بناغەی تائۆیزمن",difficulty:"hard"},{name:"هۆمیرۆس",latin:"Homer",hint:"شاعیری نەریتیی یۆنانی کۆن؛ ئیلیاد و ئۆدیسە بەو دەدرێنەوە، هەرچەند ناسنامە و نووسەرایەتیی ڕاستەقینەکەی بابەتی گفتوگۆی زانایانە",difficulty:"medium"},{name:"فیساگۆرس",latin:"Pythagoras",hint:"فەیلەسووف و بیرکارزانی یۆنانی (نزیکەی ٥٧٠–٤٩٥ پ.ز)؛ تیۆرەمەکە بە ناویەوەیە هەرچەند پێش ئەو ناسراو بوو؛ قوتابخانەکەی پەیوەندیی ژمارە و مۆسیقای لێکۆڵییەوە",difficulty:"hard"},{name:"ئۆقلیدس",latin:"Euclid",hint:"بیرکارزانی یۆنانی لە ئەسکەندەریە؛ باوکی ئەندازە؛ کتێبی بنەڕەتەکان (Elements) بۆ ٢٠٠٠ ساڵ کتێبی خوێندن بوو",difficulty:"hard"},{name:"ئەرکمیدس",latin:"Archimedes",hint:"بیرکار، ئەندازیار و داهێنەری یۆنانی لە سیراکووز؛ یاسای سەرئاوکەوتن و لێشاو (یوریکا!)؛ چەرخ و ئامێرەکانی بەرگریی شارەکەی داهێنا",difficulty:"medium"},{name:"هیپۆکرات",latin:"Hippocrates",hint:"پزیشکی یۆنانی (نزیکەی ٤٦٠–٣٧٥ پ.ز) کە بە باوکی پزیشکی ناسراوە؛ کۆمەڵە دەقی هیپۆکراتی بە قوتابخانەکەی پەیوەستە و سوێندەکە بە نەریت بە ناویەوەیە",difficulty:"medium"},{name:"جەنگیزخان",latin:"Genghis Khan",hint:"تیموچین، یەکخەرەوەی هۆزە مەغۆلەکان و دامەزرێنەری ئیمپراتۆریەتی مەغۆل لە ١٢٠٦؛ ئەو بناغەی دانا و نەوەکانی دواتر فراوانیان کرد تا بووە گەورەترین ئیمپراتۆریەتی یەکپارچەی زەویی",difficulty:"easy"},{name:"کۆبلای خان",latin:"Kublai Khan",hint:"نەوەی جەنگیزخان و پێنجەمین خاقانی مەغۆل؛ شانشینی یوانی لە چین دامەزراند؛ میوانداری گەشتیار مارکۆ پۆلۆی کرد",difficulty:"hard"},{name:"تەیموورلەنگ",latin:"Timur (Tamerlane)",hint:"فەرمانڕەوای تورک-مەغۆلی ئاسیای ناوەڕاست و دامەزرێنەری ئیمپراتۆریەتی تیموری؛ دەلھیی تاڵان کرد و لە جەنگی ئەنقەرە ١٤٠٢ سوڵتان بایەزیدی یەکەمی بەزاند؛ سەمەرقەندی پایتەخت کرد",difficulty:"hard"},{name:"ئاتیلا هون",latin:"Attila the Hun",hint:"سەرکردەی بەهێزی هۆزەکانی هون (٤٣٤–٤٥٣ ز)؛ نازناوی سزای خودا؛ هێرشی کردە سەر هەردوو ئیمپراتۆریەتی ڕۆمای ڕۆژهەڵات و ڕۆژئاوا",difficulty:"hard"},{name:"شارلەماین",latin:"Charlemagne",hint:"پاشای فرانکەکان؛ پاپ لە ساڵی ٨٠٠ وەک ئیمپراتۆری ڕۆمەکان تاجی لەسەرنا؛ بەشی زۆری ئەوروپای ڕۆژئاوای یەکخست و چاکسازیی خوێندن و نووسینی پشتیوانی کرد",difficulty:"hard"},{name:"ویلیامی داگیرکەر",latin:"William the Conqueror",hint:"دوکی نۆرماندی؛ لە جەنگی هەیستینگز ١٠٦٦ هارۆڵدی دووەمی بەزاند و بووە پاشای ئینگلتەرا؛ فرمانی بە تۆماری زەوی و سامانەکانی Domesday Book کرد",difficulty:"hard"},{name:"ژان دارک",latin:"Joan of Arc",hint:"کچی گوندنشینی فەرەنسی؛ لە جەنگی سەدساڵەدا یارمەتیی هەڵوەشاندنەوەی گەمارۆی ئۆرلێانی دا و ڕێگای تاجنانانی شارلی حەوتەمی خۆش کرد؛ لە ١٤٣١ لەسەر ئاگر سووتێنرا",difficulty:"medium"},{name:"کریستۆفەر کۆلۆمبۆس",latin:"Christopher Columbus",hint:"دەریاوانی جێنۆڤایی بە پاڵپشتیی ئیسپانیا؛ لە ١٤٩٢ گەیشتە دوورگەکانی کارائیب بە گومانی گەیشتن بە ئاسیا، لە زەوییەکدا کە گەلی خۆجێیی لێدەژیا؛ گەشتەکانی سەرەتای داگیرکاریی ئەوروپایان خێرا کرد",difficulty:"easy"},{name:"فێردیناند ماژەلان",latin:"Ferdinand Magellan",hint:"دەریاوانی پورتوگالی لە خزمەتی ئیسپانیا؛ گەشتی یەکەم سووڕانەوە بە دەوری زەویی لە ١٥١٩ دەستپێکرد و گەرووی ماژەلانی دۆزییەوە؛ خۆی لە ١٥٢١ لە فلیپین کوژرا و ئەلکانۆ گەشتەکەی تەواو کرد",difficulty:"medium"},{name:"ڤاسکۆ دا گاما",latin:"Vasco da Gama",hint:"گەشتیاری پورتوگالی؛ لە ١٤٩٨ بە سووڕانەوە بە دەوری کیشووەری ئەفریقا (کەپی ئومێدی باش) یەکەم ڕێگەی دەریاییی بۆ هیندستان دۆزییەوە",difficulty:"medium"},{name:"مارکۆ پۆلۆ",latin:"Marco Polo",hint:"بازرگان و گەشتیاری ڤێنیزی؛ نزیکەی ٢٤ ساڵ لە گەشتدا بوو؛ بەپێی گەشتنامەکەی لە دەرباری کۆبلای خان خزمەتی کرد و باسەکانی ئەوروپییەکانی بە ئاسیا ناساند",difficulty:"medium"},{name:"ابن بطوطە",latin:"Ibn Battuta",hint:"گەشتیاری مەغریبی؛ نزیکەی ٣٠ ساڵ و ١٢٠ هەزار کیلۆمەتر گەڕا؛ کتێبی گەشتنامەی ڕیحلە",difficulty:"hard"},{name:"زێنگ هی",latin:"Zheng He",hint:"ئەدمیراڵی چینی لە سەردەمی مینگ؛ لە نێوان ١٤٠٥–١٤٣٣ بە کەشتیگەلێکی گەورە حەوت گەشتی دیپلۆماسی و بازرگانی بۆ باشووری ئاسیا، کەنارەکانی عەرەب و ڕۆژهەڵاتی ئەفریقا ئەنجام دا",difficulty:"hard"},{name:"جەیمز کووک",latin:"James Cook",hint:"کاپتن و نەخشەکێشی هێزی دەریایی بەریتانیا؛ سێ گەشتی گەورەی زەریای هێمنی کرد، یەکەم سووڕانەوەی تۆمارکراوی دوورگە سەرەکییەکانی نیوزیلەند و یەکەم گەشتی ئەوروپیی تۆمارکراو بۆ کەناری ڕۆژهەڵاتی ئوسترالیا",difficulty:"medium"},{name:"هێرنان کۆرتێس",latin:"Hernán Cortés",hint:"کۆنکیستادۆری ئیسپانی؛ بە هێزێکی بچووک و هەزاران هاوپەیمانی خۆجێیی، بە تایبەتی تڵاکسکالاییەکان، تێنۆچتیتلانی گرت و لە ١٥٢١ ئیمپراتۆریەتی ئازتێکی ڕووخاند",difficulty:"hard"},{name:"فرانسیسکۆ پیزارۆ",latin:"Francisco Pizarro",hint:"کۆنکیستادۆری ئیسپانی؛ لە ١٥٣٣ ئیمپراتۆریەتی گەورەی ئینکای لە پێرو ڕووخاند و شاری لیمای پایتەختی دامەزراند",difficulty:"hard"},{name:"مۆنتێزوما",latin:"Montezuma II",hint:"دوایین ئیمپراتۆری بەهێزی ئازتێک؛ لە کاتی هێرشی کۆرتێس دەسەڵاتی لەدەست دا و ئیمپراتۆریەتەکەی ڕووخا",difficulty:"hard"},{name:"لێئۆناردۆ دا ڤینچی",latin:"Leonardo da Vinci",hint:"بلیمەتی سەردەمی ڕێنیسانس؛ وێنەکێش، ئەندازیار و زانای ئیتاڵی؛ تابلۆی مۆنالیزا، دوایین نانی ئێوارە و پیاوی ڤیترۆڤی",difficulty:"easy"},{name:"مایکل ئەنجێلۆ",latin:"Michelangelo",hint:"پەیکەرتاش، وێنەکێش و تەلارسازی ئیتاڵی؛ پەیکەری دەیڤد، پیێتا و نەخشاندنی سەقفی کڵێسای سیستین لە ڤاتیکان",difficulty:"medium"},{name:"ڕافایل",latin:"Raphael",hint:"وێنەکێش و تەلارسازی گەورەی ڕێنیسانسی ئیتاڵیا (١٤٨٣–١٥٢٠)؛ تابلۆی قوتابخانەی ئەسینا و ژوورەکانی ڕافایل لە ڤاتیکان و وێنەکانی مادۆنا",difficulty:"hard"},{name:"ڕێمبرانت",latin:"Rembrandt",hint:"لە کاریگەرترین وێنەکێشانی هۆڵەندی سەدەی ١٧؛ بە کۆنترۆڵی ڕووناکی و تاریکی، تابلۆی پاسەوانی شەو و ژمارەیەکی زۆر پۆرترەیتی خۆی ناسراوە",difficulty:"hard"},{name:"ڤینسێنت ڤان گۆخ",latin:"Vincent van Gogh",hint:"وێنەکێشی پۆست-ئیمپرێسیۆنیستی هۆڵەندی؛ ئەستێرە شەو، گوڵەبەڕۆژەکان و دەیان پۆرترەیتی خۆی؛ لە ژیانیدا سەرکەوتنی بازرگانیی زۆر کەمی هەبوو و بەشێک لە گوێی چەپی خۆی بڕی",difficulty:"easy"},{name:"پابلۆ پیکاسۆ",latin:"Pablo Picasso",hint:"وێنەکێشی ئیسپانی؛ لەگەڵ براک کیوبیزمی دامەزراند؛ تابلۆی گێرنیکا دژی جەنگ",difficulty:"easy"},{name:"فریدا کالۆ",latin:"Frida Kahlo",hint:"وێنەکێشی مەکسیکی؛ بە پۆرترەیتە قووڵەکانی خۆی و وێناکردنی ئازاری جەستەیی و ناسنامەی مەکسیکی لە ئاستی جیهاندا ناسراوە",difficulty:"medium"},{name:"یۆهانس گوتنبێرگ",latin:"Johannes Gutenberg",hint:"زێڕنگەر و داهێنەری ئەڵمانی؛ نزیکەی ١٤٥٠ سیستەمی چاپی پیتی فلزیی جوڵاوی لە ئەوروپا پەرەپێدا، هەرچەند چاپی جوڵاو پێشتر لە ڕۆژهەڵاتی ئاسیا هەبوو؛ کتێبی پیرۆزی گوتنبێرگ",difficulty:"medium"},{name:"نیکۆلاس کۆپەرنیکۆس",latin:"Nicolaus Copernicus",hint:"گەردوونناسی پۆڵەندی؛ مۆدێلی خۆر-ناوەندیی گەردوونی فۆرمەلە کرد کە زەوی و هەسارەکان بە دەوری خۆردا دەسوڕێنەوە؛ کتێبی De revolutionibus لە ١٥٤٣ بڵاوکرایەوە",difficulty:"medium"},{name:"گالیلێۆ گالیلەی",latin:"Galileo Galilei",hint:"زانای ئیتاڵی؛ باوکی زانستی تاقیکاری؛ تەلیسکۆپی بۆ سەیرکردنی مانگەکانی موشتەری بەکارهێنا و بەرگری لە بیردۆزی کۆپەرنیکۆس کرد",difficulty:"easy"},{name:"یۆهانس کێپلەر",latin:"Johannes Kepler",hint:"گەردوونناسی ئەڵمانی؛ سێ یاسای کێپلەری بۆ خولانەوەی هەسارەکان لەسەر خولگەی هێلکەیی داڕشت",difficulty:"hard"},{name:"ئایزاک نیوتن",latin:"Isaac Newton",hint:"فیزیاناس و بیرکارزانی ئینگلیزی؛ یاسای جیهانیی ڕاکێشان و سێ یاسای جوڵە؛ کیلکەلۆسی بە سەربەخۆیی لە لایبنیتس پەرەپێدا؛ کتێبی Principia لە ١٦٨٧",difficulty:"easy"},{name:"جەیمز وات",latin:"James Watt",hint:"ئەندازیاری سکۆتلەندی؛ مەکینەی هەڵمی زۆر کاراتر کرد و شۆڕشی پیشەسازیی خێرا کرد؛ یەکەی وات بە ناویەوەیە",difficulty:"medium"},{name:"چارڵز داروین",latin:"Charles Darwin",hint:"سروشتناسی ئینگلیزی؛ کتێبی بنەچەی جۆرەکان ١٨٥٩؛ بیردۆزی پەرەسەندن لە ڕێگەی هەڵبژاردنی سروشتی بە گەشتی کەشتیی بیگل",difficulty:"easy"},{name:"لوی پاستۆر",latin:"Louis Pasteur",hint:"کیمیاگەر و مایکرۆبناسی فەرەنسی؛ بە پاستۆرکردن و پەرەپێدانی بیردۆزی مایکرۆبیی نەخۆشی ناسراوە؛ ئەو و هاوکارەکانی ڤاکسینی کۆلێی مریشک، ئەنتراکس و هارییان پەرەپێدا",difficulty:"easy"},{name:"تۆماس ئێدیسۆن",latin:"Thomas Edison",hint:"داهێنەر و بازرگانی ئەمریکی بە ١٠٩٣ پەتێنتی ئەمریکی؛ فۆنۆگرافی داهێنا و لەگەڵ تیمەکەی سیستەمی کارای گڵۆپ و دابەشکردنی کارەبایی پەرەپێدا؛ تاقیگەی مینلۆ پارک",difficulty:"easy"},{name:"نیکۆلا تێسلا",latin:"Nikola Tesla",hint:"داهێنەری سڕبی-ئەمریکی؛ سیستەمی کارەبای گۆڕاو (AC) و مۆتۆری ئیندەکشن؛ ڕکابەری ئێدیسۆن لە شەڕی جەریانەکان",difficulty:"easy"},{name:"ئەلێکساندەر گراهام بێڵ",latin:"Alexander Graham Bell",hint:"زانای سکۆتلەندی-ئەمریکی؛ لە ١٨٧٦ یەکەم پەتێنتی تەلەفۆنی وەرگرت؛ مامۆستای کەسانی کەڕ بوو",difficulty:"medium"},{name:"برایانی ڕایت",latin:"Wright Brothers",hint:"ئۆرڤیل و ویلبەر ڕایت؛ داهێنەرانی ئەمریکی؛ لە ١٧ی کانوونی یەکەمی ١٩٠٣ یەکەم فڕینی کۆنترۆڵکراوی بزوێنەرداری مرۆڤیان بە سەرکەوتوویی ئەنجام دا",difficulty:"medium"},{name:"ماری کیوری",latin:"Marie Curie",hint:"فیزیاناز و کیمیاگەری پۆڵەندی-فەرەنسی؛ تاکە کەس کە دوو خەڵاتی نۆبڵی لە دوو زانستی جیاوازدا (فیزیا و کیمیا) بردووەتەوە بۆ لێکۆڵینەوەی تیشکدەری",difficulty:"easy"},{name:"ئەلبێرت ئاینشتاین",latin:"Albert Einstein",hint:"فیزیانازی ئەڵمانی؛ بیردۆزی ڕێژەیی تایبەت و گشتی، E=mc²؛ خەڵاتی نۆبڵ بۆ کاریگەریی فۆتۆکارەبایی",difficulty:"easy"},{name:"مایکڵ فارادای",latin:"Michael Faraday",hint:"فیزیاناس و کیمیاگەری ئینگلیزی؛ ئیندەکشنی کارۆموگناتیسی و یاساکانی شیکردنەوەی کارەباییی دۆزییەوە؛ یەکەم نموونەی سووڕانەوەی کارۆموگناتیسیی پیشان دا",difficulty:"hard"},{name:"جەیمز ماکسوێڵ",latin:"James Clerk Maxwell",hint:"فیزیانازی سکۆتلەندی؛ هاوکێشەکانی ماکسوێڵ کارەبا، موگناتیس و ڕووناکیی یەکخست",difficulty:"hard"},{name:"گرێگۆر مێندڵ",latin:"Gregor Mendel",hint:"ڕاهیب و زانای نەمساوی؛ بە تاقیکردنەوە لەسەر هەزاران ڕووەکی پاقڵە یاساکانی وەرگرتنی سیفەتەکانی ناساند؛ بە باوکی بۆماوەناسی ناسراوە",difficulty:"hard"},{name:"دمیتری مێندەلێیەڤ",latin:"Dmitri Mendeleev",hint:"کیمیاگەری ڕووسی؛ خشتەی خولیی توخمەکانی داڕشت و توخمی نەدۆزراوەی پێشبینی کرد",difficulty:"hard"},{name:"ئەلێکساندەر فلێمینگ",latin:"Alexander Fleming",hint:"باکتریاناسی سکۆتلەندی؛ لە ١٩٢٨ کاری دژەباکتریاییی کپکی پێنسیلیۆمی بینی و ناوی پێنسیلینی لێنا؛ فلۆری و چەین دواتر بۆ دەرمان پەرەیان پێدا؛ هەرسێکیان نۆبڵی ١٩٤٥یان برد",difficulty:"medium"},{name:"نیڵس بۆر",latin:"Niels Bohr",hint:"فیزیانازی دانیمارکی؛ مۆدێلی گەردیلە بە ئاستە وزەییەکان؛ خەڵاتی نۆبڵ ١٩٢٢؛ بنەمای فیزیای کوانتۆم",difficulty:"hard"},{name:"ئێرنست ڕەزەرفۆرد",latin:"Ernest Rutherford",hint:"فیزیانازی نیوزیلەندی؛ لە تاقیکردنەوەی وەرەقەی زێڕی گایگەر و مارسدن سەرپەرشتی کرد و مۆدێلی ناوکیی گەردیلەی پێشنیار کرد؛ بە باوکی فیزیای ناوکی ناسراوە",difficulty:"hard"},{name:"ماکس پلانک",latin:"Max Planck",hint:"فیزیانازی ئەڵمانی؛ لە ١٩٠٠ چەمکی کوانتۆمی هێنایە ئاراوە و بیردۆزی کوانتۆمی دامەزراند؛ نۆبڵی ١٩١٨",difficulty:"hard"},{name:"ئالان تورینگ",latin:"Alan Turing",hint:"بیرکاری بەریتانی و لە دامەزرێنەرانی کۆمپیوتەرزانی و هۆشی دەستکرد؛ ماشێنی تورینگ و تاقیکردنەوەی تورینگ؛ لە بلێچلی پارک لە تیمی شکاندنی کۆدی ئینگمای هێزی دەریایی ئەڵمانیا کاری کرد",difficulty:"medium"},{name:"ستیڤن هۆکینگ",latin:"Stephen Hawking",hint:"فیزیانازی بەریتانی؛ لێکۆڵینەوە لەسەر کونی ڕەش و تیشکی هۆکینگ؛ کتێبی مێژوویەکی کورتی کات پڕفرۆشترین کتێبی زانستی بوو",difficulty:"easy"},{name:"زیگمۆند فرۆید",latin:"Sigmund Freud",hint:"نۆرۆلۆژیستێکی نەمساوی و دامەزرێنەری دەروونشیکاری؛ چەمکەکانی نەستی نائاگا، لێکدانەوەی خەون، ئید و ئیگۆی پەرەپێدا؛ زۆرێک لە تیۆرەکانی ئێستا ڕەخنەیان لێدەگیرێت",difficulty:"medium"},{name:"کارڵ مارکس",latin:"Karl Marx",hint:"فەیلەسووف و ئابووریناسی ئەڵمانی؛ کتێبی سەرمایە و مانیفێستی کۆمۆنیست لەگەڵ ئەنگڵس؛ بناغەی مارکسیزم",difficulty:"easy"},{name:"ئادەم سمیت",latin:"Adam Smith",hint:"فەیلەسووف و ئابووریناسی سکۆتلەندی؛ لە دامەزرێنەرانی ئابووریی کلاسیک؛ کتێبەکانی تیۆری هەستە ئەخلاقییەکان و دەوڵەمەندیی نەتەوەکان (١٧٧٦)",difficulty:"hard"},{name:"ڕێنێ دیکارت",latin:"René Descartes",hint:"فەیلەسووف و بیرکاری فەرەنسی؛ باوکی فەلسەفەی مۆدێرن؛ داهێنەری سیستەمی کۆئۆردیناتی دیکارتی؛ (من بیر دەکەمەوە، کەواتە من هەم)",difficulty:"medium"},{name:"ئیمانۆئێل کانت",latin:"Immanuel Kant",hint:"فەیلەسووفی ئەڵمانی؛ ڕەخنەی عەقڵی پاک؛ چەمکی فەرمانی گشتگیر لە ڕەوشتدا",difficulty:"hard"},{name:"فریدریش نیتشە",latin:"Friedrich Nietzsche",hint:"فەیلەسووفی ئەڵمانی؛ بە ڕەخنە لە ئەخلاق و ئایینی ڕۆژئاوا و چەمکی Übermensch ناسراوە؛ نووسەری وەها ئاخاوت زەردەشت و لە دەرەوەی خێر و شەڕ",difficulty:"hard"},{name:"ڤۆڵتێر",latin:"Voltaire",hint:"نووسەر و فەیلەسووفی ڕۆشنگەریی فەرەنسی؛ بە تانز ڕەخنەی لە دەسەڵاتی ئایینی و سیاسی دەگرت و داکۆکیی لە لێبوردەیی ئایینی و ئازادیی بیرکردنەوە دەکرد؛ نووسەری Candide",difficulty:"hard"},{name:"ویلیام شێکسپیر",latin:"William Shakespeare",hint:"شانۆنووس و شاعیری ئینگلیزی و لە کاریگەرترین نووسەرانی جیهان؛ هاملێت، ماکبێث، ئۆسێلۆ و ڕۆمیۆ و جولیێت؛ ١٥٤ سۆنێتی هەیە",difficulty:"easy"},{name:"دانتێ ئەلیگێری",latin:"Dante Alighieri",hint:"شاعیری ئیتاڵی سەدەی ١٤؛ کۆمیدیای ئیلاهی (دۆزەخ، بەرزەخ، بەهەشت)؛ باوکی زمانی ئیتاڵی",difficulty:"hard"},{name:"میگێل دی سێرڤانتس",latin:"Miguel de Cervantes",hint:"نووسەر و سەربازی ئیسپانی؛ دۆن کیشۆتی نووسی کە زۆرجار بە یەکەم ڕۆمانی مۆدێرن دادەنرێت؛ پاڵەوانەکەی ئاشە باوەکان بە دژمن دەزانێت",difficulty:"hard"},{name:"یۆهان ڤۆلفگانگ فۆن گۆتە",latin:"Johann Wolfgang von Goethe",hint:"لە کاریگەرترین نووسەر و شاعیرانی ئەڵمانی؛ شانۆنامەی فاوست و ڕۆمانی ئازارەکانی وێرتەری گەنج؛ لە زانست و سیاسەتیشدا کاری کرد",difficulty:"hard"},{name:"لیۆ تۆڵستۆی",latin:"Leo Tolstoy",hint:"ڕۆماننووسی ڕووسی؛ جەنگ و ئاشتی و ئاننا کارێنینا؛ بیرۆکەی ناتوندوتیژی کاریگەریی لە گاندی کرد",difficulty:"medium"},{name:"فیۆدۆر دۆستۆیەڤسکی",latin:"Fyodor Dostoevsky",hint:"ڕۆماننووسی ڕووسی؛ تاوان و سزا، براکانی کارامازۆڤ؛ شیکاری قووڵی دەروونی مرۆڤ",difficulty:"medium"},{name:"چارڵز دیکێنس",latin:"Charles Dickens",hint:"نووسەری ئینگلیزی سەردەمی ڤیکتۆریا؛ ئۆلیڤەر تویست و چاوەڕوانییە مەزنەکان؛ وێنای هەژاریی کرێکاران",difficulty:"hard"},{name:"مارک تواین",latin:"Mark Twain",hint:"نووسەری ئەمریکی؛ تۆم سۆیەر و هەکلبێری فین؛ بە تانز و ڕەخنەی کۆمەڵایەتی ناسراوە",difficulty:"medium"},{name:"جێن ئۆستن",latin:"Jane Austen",hint:"نووسەری ئینگلیز؛ شانازی و لایەنگیری و هەست و هۆش؛ ڕەخنە لە کۆمەڵگای چینایەتی بە تانز",difficulty:"medium"},{name:"فرانتس کافکا",latin:"Franz Kafka",hint:"نووسەری چێکی بە ئەڵمانی؛ مێتامۆرفۆسیس و دادگا؛ وشەی کافکایی لە ناویەوە هاتووە",difficulty:"hard"},{name:"ڤیکتۆر هیگۆ",latin:"Victor Hugo",hint:"نووسەری فەرەنسی؛ بێنەوایان و کەمبەکۆڵەکەی نۆتردام؛ داکۆکیکار لە هەژاران و دژی سزای لەسێدارەدان",difficulty:"medium"},{name:"ڕابیندرانات تاگۆر",latin:"Rabindranath Tagore",hint:"شاعیر و نووسەری بەنگاڵی؛ یەکەم براوەی ئاسیایی خەڵاتی نۆبڵی ئەدەب لە ١٩١٣؛ نووسەری گیتانجالی؛ گۆرانییەکانی بوونە سرودی نەتەوەیی هیندستان و بەنگلادیش",difficulty:"hard"},{name:"وۆڵفگانگ مۆتسارت",latin:"Wolfgang Amadeus Mozart",hint:"ئاوازدانەری نەمساوی سەردەمی کلاسیک؛ لە منداڵییەوە ئاوازی دادەنا؛ زیاتر لە ٦٠٠ شاکاری مۆسیقای وەک دۆن جیۆڤانی و زاوڕەقە جادوویەکە نووسی",difficulty:"easy"},{name:"لودڤیگ ڤان بێتھۆڤن",latin:"Ludwig van Beethoven",hint:"ئاوازدانەری ئەڵمانی؛ پیانۆژەنی بلیمەت؛ لە کاتی کەڕبووندا سیمفۆنیای نۆیەم و سرودی شادمانی نووسی",difficulty:"easy"},{name:"یۆهان سباستیان باخ",latin:"Johann Sebastian Bach",hint:"ئاوازدانەر و ئۆرگانژەنی ئەڵمانیی سەردەمی بارۆک؛ کۆنچێرتۆکانی براندنبۆرگ، ماتای پاسۆن و The Well-Tempered Clavier؛ کاریگەریی گەورەی لە مۆسیقای ڕۆژئاوایی کرد",difficulty:"medium"},{name:"پیۆتر چایکۆڤسکی",latin:"Pyotr Tchaikovsky",hint:"ئاوازدانەری گەورەی ڕووسی لە سەردەمی ڕۆمانسیزم؛ مۆسیقای باڵێی دەریاچەی قوو، فندقشکێن و خەوتووە جوانەکە",difficulty:"medium"},{name:"فریدریک شۆپان",latin:"Frédéric Chopin",hint:"پیانۆژەن و ئاوازدانەری پۆڵەندی؛ نۆکتێرن، مازوورکا و پۆلۆنێز؛ شاعیری پیانۆ",difficulty:"hard"},{name:"ئانتۆنیۆ ڤیڤالدی",latin:"Antonio Vivaldi",hint:"ئاوازدانەری ئیتاڵی و قەشە؛ چوار وەرزەکان؛ زیاتر لە ٥٠٠ کۆنچێرتۆی نووسی",difficulty:"hard"},{name:"ڕیچارد ڤاگنەر",latin:"Richard Wagner",hint:"ئاوازدانەری ئەڵمانی؛ ئەڵقەی نیبێلۆنگ کە چوار ئۆپێرایە؛ چەمکی کاری هونەریی تەواو",difficulty:"hard"},{name:"جۆزێپێ ڤێردی",latin:"Giuseppe Verdi",hint:"ئاوازدانەری ئیتاڵی؛ ئۆپێراکانی ئایدا، لا تراڤیاتا و ڕیگۆلێتۆ؛ ناو و ئۆپێراکانی بوونە هێمای بزووتنەوەی یەکخستنی ئیتاڵیا",difficulty:"hard"},{name:"لویی چواردەهەم",latin:"Louis XIV",hint:"پاشای فەرەنسا بۆ ٧٢ ساڵ (١٦٤٣–١٧١٥)؛ بە پاشای خۆر ناسرا؛ کۆشکی ڤێرسای فراوان کرد و دەسەڵاتی شاهانەی ناوەندی بەهێز کرد",difficulty:"medium"},{name:"پیتەری مەزن",latin:"Peter the Great",hint:"تزاری ڕووسیا (١٦٨٢–١٧٢٥)؛ سوپا و دەوڵەتی بە شێوەی ئەوروپایی چاکسازی کرد، دەستی بە دروستکردنی سانت پیتەرسبۆرگ کرد و دوای جەنگی باکوور دەریگای بۆ دەریای بالتیک کردەوە",difficulty:"medium"},{name:"کاترینی مەزن",latin:"Catherine the Great",hint:"ئیمپراتۆری ڕووسیا (١٧٦٢–١٧٩٦)؛ سنووری ئیمپراتۆریەتی فراوان کرد، هونەر و خوێندنی پشتیوانی کرد و لەگەڵ بیرمەندانی ڕۆشنگەری پەیوەندی هەبوو، هەرچەند کۆیلایەتیی جوتیاران بەردەوام بوو",difficulty:"hard"},{name:"فریدریکی مەزن",latin:"Frederick the Great",hint:"پاشای پرووسیا (١٧٤٠–١٧٨٦)؛ بە سەرکردایەتیی سەربازیی بەهێز و پاڵپشتیی ڕۆشنگەری و هونەر و مۆسیقا پرووسیای کردە زلهێزێکی ئەوروپا",difficulty:"hard"},{name:"شاژن ئەلیزابێتی یەکەم",latin:"Queen Elizabeth I",hint:"شاژنی ئینگلتەرا (١٥٥٨–١٦٠٣)؛ لە سەردەمی ئەودا ئارمادای ئیسپانیا لە ١٥٨٨ دۆڕا و شانۆی شێکسپیر گەشەی کرد؛ بە شاژنی پاکیزە ناسراوە",difficulty:"hard"},{name:"هێنری هەشتەم",latin:"Henry VIII",hint:"پاشای ئینگلتەرا لە سەدەی ١٦؛ شەش جار هاوسەرگیری کرد و دووانیانی لەسێدارە دا؛ کڵێسای ئینگلتەرای لە کاتۆلیک جیاکردەوە",difficulty:"medium"},{name:"شاژن ڤیکتۆریا",latin:"Queen Victoria",hint:"شاژنی بەریتانیا (١٨٣٧–١٩٠١) و ئیمپراتۆری هیندستان لە ١٨٧٦ەوە؛ سەردەمەکەی بە پیشەسازی، گەشەی ئیمپراتۆریەت و گۆڕانی کۆمەڵایەتی ناسراوە",difficulty:"medium"},{name:"ناپۆلیۆن بۆناپارت",latin:"Napoleon Bonaparte",hint:"ژەنەڕاڵ و ئیمپراتۆری فەرەنسا؛ کودێکی دەوڵەتیی ١٧٩٩ی کرد و کۆدی ناپلیۆنی لە ١٨٠٤ پەسەند کرد؛ لە واتەرلۆ ١٨١٥ دۆڕا و بۆ سانت هێلێنا دوورخرایەوە",difficulty:"easy"},{name:"ئۆتۆ فۆن بیسمارک",latin:"Otto von Bismarck",hint:"سەرۆک وەزیری پرووسیا؛ بە سیاسەتی خوێن و ئاسن ئەڵمانیای یەکخست ١٨٧١؛ نازناوی شانسلێری ئاسنین",difficulty:"hard"},{name:"جۆزێپێ گاریباڵدی",latin:"Giuseppe Garibaldi",hint:"ژەنەڕاڵی ئیتاڵی؛ بە سوپای هەزار سوورپۆش باشووری ئیتاڵیای گرت و ڕۆڵی سەرەکی لە یەکخستنی ئیتاڵیا بینی",difficulty:"hard"},{name:"جۆرج واشنگتۆن",latin:"George Washington",hint:"فەرماندەی سوپای کۆلۆنییەکان لە شۆڕشی سەربەخۆیی و یەکەم سەرۆکی ئەمریکا (١٧٨٩–١٧٩٧)؛ دوای دوو خول بە خۆویستی وازی لە دەسەڵات هێنا",difficulty:"easy"},{name:"تۆماس جێفرسۆن",latin:"Thomas Jefferson",hint:"سەرۆکی سێیەمی ئەمریکا؛ نووسەری سەرەکیی ڕاگەیاندنی سەربەخۆییی ئەمریکا ١٧٧٦؛ زەوییەکانی لویزیانای کڕی",difficulty:"medium"},{name:"ئەبراهام لینکۆڵن",latin:"Abraham Lincoln",hint:"سەرۆکی ١٦ەمی ئەمریکا؛ لە جەنگی ناوخۆ یەکێتیی وڵاتی پاراست و ڕاگەیاندنی ئازادکردنی کۆیلەکانی دەرکرد؛ هەڵوەشاندنەوەی یاساییی کۆیلایەتی بە پاشکۆی ١٣ تەواو بوو؛ لە ١٨٦٥ تیرۆرکرا",difficulty:"easy"},{name:"بنجامین فرەنکلین",latin:"Benjamin Franklin",hint:"چاپکەر، زانا، دیپلۆمات و یەکێک لە باوکانی دامەزرێنەری ئەمریکا؛ دژەبروسکەی داهێنا و بە تاقیکردنەوەکانی پەیوەندیی بروسکە و کارەبایی پیشان دا",difficulty:"medium"},{name:"سیمۆن بۆلیڤار",latin:"Simón Bolívar",hint:"فەرماندە و سیاسەتمەداری ڤێنزوێلایی بە نازناوی ڕزگارکەر؛ ڕۆڵی سەرەکی لە سەربەخۆیی ڤێنزوێلا، کۆلۆمبیا، ئیکوادۆر، پێرو و بۆلیڤیا لە ئیسپانیا هەبوو؛ بۆلیڤیا بە ناویەوەیە",difficulty:"medium"},{name:"خۆسێ دی سان مارتین",latin:"José de San Martín",hint:"ژەنەڕاڵی ئەرجەنتینی؛ بە پەڕینەوە بە ئەندیز ئەرجەنتین، چیلی و پیرۆی ڕزگار کرد",difficulty:"hard"},{name:"توسان لوڤێرتور",latin:"Toussaint Louverture",hint:"کۆیلەی ئازادکراو و فەرماندەی سەرەکیی شۆڕشی هایتی؛ کۆیلایەتیی لە سان دومینگە لەناوبرد و دەستووری ١٨٠١ی داڕشت؛ فەرەنسا دەستگیری کرد و لە ١٨٠٣، پێش سەربەخۆیی هایتی، لە زیندان مرد",difficulty:"hard"},{name:"مستەفا کەمال ئاتاتورک",latin:"Mustafa Kemal Atatürk",hint:"فەرماندەی جەنگی سەربەخۆیی و دامەزرێنەر و یەکەم سەرۆکی کۆماری تورکیا (١٩٢٣–١٩٣٨)؛ سوڵتانەتی عوسمانی هەڵوەشاندەوە و چاکسازیی سکۆلاری و ئەلفوبێی لاتینی جێگیر کرد",difficulty:"easy"},{name:"مەهاتما گاندی",latin:"Mahatma Gandhi",hint:"پارێزەر و ڕابەری بزووتنەوەی سەربەخۆییی هیندستان لە بەریتانیا؛ ساتیاگراها و بەرگریی مەدەنیی ناتوندوتیژی بەکارهێنا؛ ڕێپێوانی خوێی ١٩٣٠ی سەرکردایەتی کرد",difficulty:"easy"},{name:"جەواهەرلال نەهرۆ",latin:"Jawaharlal Nehru",hint:"یەکەم سەرۆک وەزیری هیندستانی سەربەخۆ (١٩٤٧–١٩٦٤)؛ لە دامەزرێنەرانی بزووتنەوەی نا-پەیوەست و سیاسەتی سکۆلاری وڵات؛ باوکی ئیندیرا گاندی",difficulty:"hard"},{name:"محەمەد عەلی جیناح",latin:"Muhammad Ali Jinnah",hint:"پارێزەر و ڕابەری کۆمەڵەی موسڵمانانی هیند؛ سەرکردەی داواکاریی دامەزراندنی پاکستان لە ١٩٤٧ و یەکەم گۆڤەرنەر-جەنەڕاڵی بوو؛ بە قائیدی ئەعزەم ناسراوە",difficulty:"medium"},{name:"ڤلادیمیر لینین",latin:"Vladimir Lenin",hint:"سەرکردەی بۆلشەڤیکەکان و ڕابەری شۆڕشی تشرینی یەکەمی ١٩١٧ی ڕووسیا؛ یەکەم سەرکردەی دەوڵەتی سۆڤیەت",difficulty:"medium"},{name:"جۆزێف ستالین",latin:"Joseph Stalin",hint:"سەرکردەی دیکتاتۆری یەکێتیی سۆڤیەت لە کۆتایی بیستەکان تا ١٩٥٣؛ پیشەسازیکردن و کۆکردنەوەی کشتوکاڵ بە زۆر، برسێتی و پاکتاوە گەورەکان؛ سۆڤیەت لە دۆڕاندنی نازییەکاندا سەرکردایەتی کرد",difficulty:"easy"},{name:"ئادۆڵف هیتلەر",latin:"Adolf Hitler",hint:"دیکتاتۆری نازی لە ئەڵمانیا (١٩٣٣–١٩٤٥)؛ هەڵگیرسێنەری جەنگی جیهانی دووەم و هۆلۆکۆست؛ نووسەری کتێبی خەباتی من",difficulty:"easy"},{name:"بێنیتۆ موسۆلینی",latin:"Benito Mussolini",hint:"دامەزرێنەری فاشیزم و دیکتاتۆری ئیتاڵیا ١٩٢٢–١٩٤٣؛ هاوپەیمانی هیتلەر؛ لە ١٩٤٥ کوژرا",difficulty:"medium"},{name:"فرانسیسکۆ فرانکۆ",latin:"Francisco Franco",hint:"ژەنەڕاڵ و دیکتاتۆری ئیسپانیا ١٩٣٩–١٩٧٥ دوای جەنگی ناوخۆی ئیسپانیا",difficulty:"hard"},{name:"ماو زێدۆنگ",latin:"Mao Zedong",hint:"سەرکردەی حیزبی کۆمۆنیست و دامەزرێنەری کۆماری گەلی چین لە ١٩٤٩؛ باز بەرەو پێشەوەی گەورە برسێتییەکی کوشندەی دروست کرد و شۆڕشی کولتووری دەستی پێکرد",difficulty:"easy"},{name:"وینستۆن چەرچڵ",latin:"Winston Churchill",hint:"سەرۆک وەزیری بەریتانیا لە جەنگی جیهانی دووەم؛ بە وتارەکانی بەرگریی گەلی هاندا؛ خەڵاتی نۆبڵی ئەدەب ١٩٥٣",difficulty:"easy"},{name:"شارل دۆگۆل",latin:"Charles de Gaulle",hint:"سەرکردەی فەرەنسای ئازاد دژی نازییەکان؛ دامەزرێنەری کۆماری پێنجەم و سەرۆک ١٩٥٩–١٩٦٩",difficulty:"medium"},{name:"فرانکلین ڕۆزڤێڵت",latin:"Franklin D. Roosevelt",hint:"سەرۆکی ٣٢ەمی ئەمریکا و تاکە سەرۆک کە چوار جار هەڵبژێردرا؛ بە پڕۆگرامی New Deal وڵاتی بەرامبەر قەیرانی گەورەی ئابووری سەرکردایەتی کرد و تا نیسانی ١٩٤٥ لە جەنگی جیهانیی دووەمدا لە دەسەڵات بوو",difficulty:"medium"},{name:"جۆن ئێف کێنەدی",latin:"John F. Kennedy",hint:"سەرۆکی ٣٥ەمی ئەمریکا؛ قەیرانی مووشەکی کووبا و پڕۆژەی ئاپۆلۆ؛ لە ١٩٦٣ لە داڵاس تیرۆرکرا",difficulty:"easy"},{name:"چی گێڤارا",latin:"Che Guevara",hint:"پزیشک و شۆڕشگێڕی ئەرجەنتینی؛ لەگەڵ کاسترۆ شۆڕشی کووبای بردەوە؛ لە ١٩٦٧ لە بۆلیڤیا کوژرا؛ وێنەکەی سیمبولی شۆڕشە",difficulty:"medium"},{name:"فیدێل کاسترۆ",latin:"Fidel Castro",hint:"ڕابەری شۆڕشی کووبا لە ١٩٥٩؛ وەک سەرۆک وەزیران و دواتر سەرۆک تا ٢٠٠٨ حکومڕانی کرد و دەوڵەتێکی یەک‌حیزبی سۆسیالیستی دامەزراند؛ قەیرانی مووشەکی کووبا لە سەردەمی ئەودا بوو",difficulty:"medium"},{name:"هۆ چی مین",latin:"Ho Chi Minh",hint:"دامەزرێنەری ڤیەت مین و یەکەم سەرۆکی ڤیەتنامی باکوور؛ ڕابەری خەباتی سەربەخۆیی دژی فەرەنسا و سیمبولی دژایەتیی ئەمریکا؛ دوای یەکخستن سایگۆن بە ناویەوە نێودرا",difficulty:"hard"},{name:"نێڵسۆن ماندێلا",latin:"Nelson Mandela",hint:"ڕابەری دژە ئاپارتاید لە ئەفریقای باشوور؛ ٢٧ ساڵ لە زیندان مایەوە؛ بووە یەکەم سەرۆکی ڕەشپێستی وڵات لە ١٩٩٤؛ نۆبڵی ئاشتی",difficulty:"easy"},{name:"مارتن لۆسەر کینگی بچووک",latin:"Martin Luther King Jr.",hint:"ڕابەری بزووتنەوەی مافە مەدەنییەکانی ئەمریکا؛ وتاری خەونێکم هەیە ١٩٦٣؛ خەڵاتی نۆبڵی ئاشتی؛ لە ١٩٦٨ تیرۆرکرا",difficulty:"easy"},{name:"ڕۆزا پارکس",latin:"Rosa Parks",hint:"چالاکوانی مافە مەدەنییەکان لە ئەمریکا؛ لە ١٩٥٥ لە مۆنتگۆمەری ڕەتیکردەوە جێگاکەی لە پاسدا بداتە پیاوێکی سپی‌پێست و بایکۆتی گەورەی پاسی دەستپێکرد",difficulty:"medium"},{name:"دایک تێرێزا",latin:"Mother Teresa",hint:"ڕاهیبەی کاتۆلیکی بە ڕەچەڵەک ئەلبانی، لە سکۆپیە لەدایک بوو؛ لە کۆلکەتای هیندستان ڕێکخراوی Missionaries of Charityی دامەزراند؛ خەڵاتی نۆبڵی ئاشتی ١٩٧٩",difficulty:"easy"},{name:"فلۆرێنس نایتینگەیل",latin:"Florence Nightingale",hint:"پەرستار، ئامارناس و چاکسازێکی بەریتانی؛ لە جەنگی کریمیا چاودێریی نەخۆشخانەی باشتر کرد و پەرستاریی پیشەیی پەرەپێدا؛ بە خاتوونی چرا ناسراوە",difficulty:"hard"},{name:"ابن سینا",latin:"Ibn Sina (Avicenna)",hint:"پزیشک، فەیلەسووف و زانای موسڵمان (٩٨٠–١٠٣٧)؛ کتێبی یاسای پزیشکی (القانون في الطب) بۆ پێنج سەدە لە زانکۆکانی ئەوروپا دەخوێندرا",difficulty:"easy"},{name:"محەمەد خوارزمی",latin:"Al-Khwarizmi",hint:"بیرکار، ئەستێرەناس و زانای بەیت‌الحیکمەی بەغدا؛ کتێبی الجبر و المقابلة شێوازی ڕێکخراوی چارەسەری هاوکێشەکانی ناساند؛ وشەی algorithm لە ناوی لاتینیی ئەوەوە هاتووە",difficulty:"medium"},{name:"جەلالەدینی ڕۆمی",latin:"Jalal ad-Din Rumi",hint:"شاعیر و زانای سۆفی (١٢٠٧–١٢٧٣) کە لە قۆنیە ژیا؛ مەسنەوی مەعنەوی و دیوانی شەمس؛ ڕێبازی مەولەوی و سەمای دەروێشان دوای مردنی لەلایەن شوێنکەوتووانییەوە دامەزرا",difficulty:"easy"},{name:"عومەر خەییام",latin:"Omar Khayyam",hint:"شاعیر، بیرکار و ئەستێرەناسی فارسی؛ چوارینەکان (ڕوباعیات)؛ ساڵنامەی جەلالیی داڕشت",difficulty:"medium"},{name:"حافزی شیرازی",latin:"Hafez",hint:"شاعیری گەورەی فارسی لە شیراز؛ دیوانی حافز؛ تا ئێستا خەڵک بۆ فاڵ دیوانەکەی دەکەنەوە",difficulty:"medium"},{name:"ئیبن خەلدون",latin:"Ibn Khaldun",hint:"مێژووناس و بیرمەندی تونسی (١٣٣٢–١٤٠٦)؛ کتێبی موقەددیمەی لەسەر چۆنیەتیی هەستان و ڕووخانی دەوڵەتەکان و عەسەبییە نووسی؛ لە پێشەنگانی کۆمەڵناسی و مێژوونوسیی ڕەخنەیی دادەنرێت",difficulty:"hard"},{name:"ئەلبیرونی",latin:"Al-Biruni",hint:"زانای خوارزمیی سەدەی ١١؛ بە ڕێگای ئەندازەیی نیوەتیرەی زەوی هەژمار کرد؛ کتێبی تەحقیق ما للهند کولتوور و زانستی هیندستانی بە شێوەی بەراوردکاری لێکۆڵییەوە",difficulty:"hard"},{name:"ئیبن ڕوشد",latin:"Averroes (Ibn Rushd)",hint:"فەیلەسووف، دادوەر و پزیشکی ئەندەلوسی لە قورتوبە (١١٢٦–١١٩٨)؛ شەرحەکانی بۆ ئەرەستوو کاریگەریی گەورەیان لە فەلسەفەی ئەوروپای سەدەکانی ناوەڕاست کرد",difficulty:"hard"},{name:"سوڵتان محەمەدی فاتح",latin:"Mehmed II",hint:"سوڵتانی عوسمانی؛ لە ١٤٥٣ قوستەنتینیی گرت، کۆتایی بە ئیمپراتۆریەتی بیزەنتی هێنا و شارەکەی کردە پایتەختی عوسمانی؛ بە فاتح ناسرا",difficulty:"medium"},{name:"سولەیمانی قانونی",latin:"Suleiman the Magnificent",hint:"سوڵتانی عوسمانی ١٥٢٠–١٥٦٦؛ لووتکەی دەسەڵاتی عوسمانی؛ چاکسازیی یاسا، نازناوی قانونی",difficulty:"medium"},{name:"ئەکبەری مەزن",latin:"Akbar the Great",hint:"سێیەمین ئیمپراتۆری مەغۆلی هیندستان (١٥٥٦–١٦٠٥)؛ دەسەڵاتی بەسەر بەشی زۆری باکوور و ناوەڕاستی هیندستاندا فراوان کرد؛ بە لێبوردەیی ئایینی، هەڵوەشاندنەوەی جزیە و گفتوگۆی نێوان ئایینەکان ناسراوە",difficulty:"hard"},{name:"ئێلڤیس پرێسلی",latin:"Elvis Presley",hint:"گۆرانیبێژ و ئەکتەری ئەمریکی بە نازناوی پاشای ڕۆک ئەند ڕۆڵ؛ گۆرانی Heartbreak Hotel و Jailhouse Rock؛ تێکەڵکردنی ڕیتم ئەند بلووز، کانتری و پۆپ",difficulty:"easy"},{name:"مایکڵ جاکسۆن",latin:"Michael Jackson",hint:"گۆرانیبێژ و سەماکەری ئەمریکی بە نازناوی پاشای پۆپ؛ Thriller پڕفرۆشترین ئەلبومی جیهانە؛ گۆرانی Billie Jean و Beat It و سەمای Moonwalk",difficulty:"easy"},{name:"فرێدی مێرکیوری",latin:"Freddie Mercury",hint:"گۆرانیبێژی گرووپی کوین؛ بۆهیمیان ڕاپسۆدی و وی ئار دە چامپیۆنز؛ کۆنسێرتی لایڤ ئەید ١٩٨٥",difficulty:"easy"},{name:"بۆب مارلی",latin:"Bob Marley",hint:"گۆرانیبێژی جامایکایی؛ جیهان بە مۆسیقای ڕێگی ناساند؛ گۆرانی نۆ وومەن نۆ کرای و وان لاڤ",difficulty:"medium"},{name:"جۆن لێنۆن",latin:"John Lennon",hint:"گۆرانیبێژ و ئاوازدانەری گرووپی بیتڵز؛ گۆرانی ئیماجین وەک سرودی ئاشتی جیهانی؛ لە ١٩٨٠ لە نیویۆرک بە تەقە تیرۆرکرا",difficulty:"medium"},{name:"فرانک سیناترا",latin:"Frank Sinatra",hint:"گۆرانیبێژ و ئەکتەری ئەمریکی؛ نازناوی چاو شینەکە؛ گۆرانی مای وەی و نیویۆرک نیویۆرک",difficulty:"medium"},{name:"محەمەد عەلی",latin:"Muhammad Ali",hint:"بۆکسەری قورسی ئەمریکی کە خۆی بە «گەورەترین» دەناساند؛ سێ جار پاڵەوانی جیهان؛ بۆ جەنگی ڤیەتنام نەچوو و خەباتی بۆ مافە مەدەنییەکان کرد",difficulty:"easy"},{name:"جێسی ئۆوێنز",latin:"Jesse Owens",hint:"ڕاکەر و بازدەری ڕەشپێستی ئەمریکی؛ لە ئۆڵۆمپیادی بەرلینی ١٩٣٦ چوار مەدالیای زێڕی لە ١٠٠م، ٢٠٠م، بازدانی درێژ و ڕاکردنی تیمی بردەوە، لە کاتی بانگەشەی ڕەگەزپەرستیی نازی",difficulty:"hard"},{name:"بێیب ڕووس",latin:"Babe Ruth",hint:"یاریزانی بەیسبۆڵی ئەمریکی؛ گەورەترین ئەفسانەی نیویۆرک یانکیز؛ ڕیکۆردی هۆم ڕەن بۆ دەیان ساڵ",difficulty:"hard"},{name:"ئایرتن سێنا",latin:"Ayrton Senna",hint:"شۆفێری ئەفسانەیی بەرازیلی لە فۆرمولا یەک؛ سێ جار پاڵەوانی جیهان لەگەڵ مکلارێن؛ لە پێشبڕکێی ئیمۆلای ١٩٩٤ لە ڕووداوێکی دڵتەزێندا کۆچی دوایی کرد",difficulty:"medium"},{name:"چارلی چاپڵین",latin:"Charlie Chaplin",hint:"ئەکتەر، دەرهێنەر و ئاوازدانەری بەریتانی لە سینەمای بێدەنگ؛ کەسایەتیی هەمیشەیی کەمبەکۆڵ (The Tramp)؛ فیلمەکانی سەردەمی نوێ و دیکتاتۆری گەورە",difficulty:"medium"},{name:"واڵت دیزنی",latin:"Walt Disney",hint:"بەرهەمهێنەر و پێشەنگی ئەنیمەیشنی ئەمریکی؛ هاودروستکەری میکی ماوس لەگەڵ ئوب ئایوێرکس؛ بەرهەمهێنەری Snow White، یەکەم فیلمی درێژی ئەنیمەیشنیی کۆمپانیاکە؛ ٢٢ ئۆسکاری برد",difficulty:"easy"},{name:"ئەلفرێد هیچکۆک",latin:"Alfred Hitchcock",hint:"دەرهێنەری بەریتانی؛ مامۆستای فیلمی دڵەڕاوکێ؛ سایکۆ، باڵندەکان و ڕێر ویندۆ",difficulty:"hard"},{name:"مارلین مۆنرۆ",latin:"Marilyn Monroe",hint:"ئەکتەر و ئایکۆنی هۆلیوودی پەنجاکان؛ فیلمەکانی Some Like It Hot و Gentlemen Prefer Blondes؛ بە وێنەی ستارەی قژزەرد و ژیانی کورت و تراژیدییەکەی ناسراوە",difficulty:"medium"},{name:"ئۆدری هێپبێرن",latin:"Audrey Hepburn",hint:"ئەکتەرێکی بەریتانی؛ ئۆسکاری باشترین ئەکتەری بۆ Roman Holiday و ڕۆڵی ناسراوی لە Breakfast at Tiffany's؛ دواتر باڵیۆزی چاکەخوازیی یونیسێف بوو",difficulty:"hard"},{name:"بروس لی",latin:"Bruce Lee",hint:"ئەستێرەی سینەما و دامەزرێنەری شێوازی جیت کون دۆ لە هونەرە جەنگییەکان؛ فیلمی دەربازبوون لە ئەژدیها؛ هونەری جەنگیی ڕۆژهەڵاتی بە جیهان ناساند",difficulty:"easy"},{name:"هێلن کێلەر",latin:"Helen Keller",hint:"نووسەر و چالاکوانی ئەمریکی کە لە منداڵییەوە نابینا و نابیست بوو؛ بە یارمەتیی مامۆستاکەی ئەن سالیڤان فێری زمان بوو و یەکەم کەسی نابینا-نابیست بوو بڕوانامەی بەکالۆریۆسی وەرگرت",difficulty:"medium"},{name:"ئامیلیا ئێرهارت",latin:"Amelia Earhart",hint:"فڕۆکەوانی ئەمریکی؛ یەکەم ژن بە تەنیا بەسەر زەریای ئەتڵەسیدا فڕی (١٩٣٢)؛ لە ١٩٣٧ لە کاتی هەوڵدان بۆ دەوری جیهان بە فڕۆکە لە زەریای هێمن بێسەروشوێن بوو",difficulty:"hard"},{name:"ئان فرانک",latin:"Anne Frank",hint:"کچێکی جوولەکەی ئەڵمانی کە لە کاتی هۆلۆکۆست لە ئەمستەردام خۆی شاردەوە؛ ڕۆژنامەکەی شایەتحاڵی ژیانی ژێر داگیرکاریی نازییە؛ لە کەمپی بەرگن-بێڵزن مرد",difficulty:"medium"},{name:"تۆکوگاوا ئیەیاسو",latin:"Tokugawa Ieyasu",hint:"ژەنەڕاڵ و یەکخەری ژاپۆن؛ دامەزرێنەری شۆگۆناتی تۆکوگاوا لە ١٦٠٣ کە بۆ زیاتر لە ٢٥٠ ساڵ ئاشتی و سەقامگیریی بەسەر ژاپۆندا سەپاند",difficulty:"hard"},{name:"ڕۆئاڵد ئامۆندسێن",latin:"Roald Amundsen",hint:"گەشتیاری جەمسەری نەرویژی؛ یەکەم مرۆڤ کە لە ١٩١١ گەیشتە جەمسەری باشووری زەوی پێش ڕۆبێرت سکۆت",difficulty:"hard"},{name:"هۆراشیۆ نێڵسۆن",latin:"Horatio Nelson",hint:"ئەدمیراڵی هێزی دەریایی بەریتانیا؛ لە ترافالگار ١٨٠٥ کەشتیگەلی فەرەنسا و ئیسپانیای بەزاند، بەڵام لە هەمان جەنگدا کوژرا؛ ستوونی نێڵسۆن لە لەندەن بە ناویەوەیە",difficulty:"hard"},{name:"سەدام حوسێن",latin:"Saddam Hussein",hint:"سەرۆکی پێشووی ڕژێمی بەعس لە عێراق (١٩٧٩–٢٠٠٣)؛ هێرش بۆ سەر ئێران و داگیرکردنی کووەیت؛ شاڵاوەکانی ئەنفال و کیمیابارانی هەڵەبجە",difficulty:"medium"},{name:"معەمەر قەزافی",latin:"Muammar Gaddafi",hint:"سەرکردەی لیبیا بۆ زیاتر لە ٤٢ ساڵ (١٩٦٩–٢٠١١)؛ نووسەری پەڕتووکی سەوز؛ لە شۆڕشی ٢٠١١ی لیبیا کوژرا",difficulty:"medium"},{name:"جەمال عەبدولناسر",latin:"Gamal Abdel Nasser",hint:"سەرۆکی میسر (١٩٥٤–١٩٧٠)؛ نەتەوەییکردنی کەناڵی سوێس؛ ڕابەری بزووتنەوەی ناسیۆنالیزمی عەرەبی (ناسریزم)",difficulty:"medium"},{name:"ئەنوەر سادات",latin:"Anwar Sadat",hint:"سەرۆکی میسر (١٩٧٠–١٩٨١)؛ لە جەنگی ١٩٧٣دا هێرشی بۆ سەر سینا کرد؛ پەیماننامەی ئاشتیی میسر-ئیسرائیل دوای کەمپ دەیڤید واژۆ کرد و نۆبڵی ئاشتی برد؛ لە ١٩٨١ تیرۆرکرا",difficulty:"hard"},{name:"یاسر عەرەفات",latin:"Yasser Arafat",hint:"ڕابەری بزووتنەوەی فەلەستین و سەرۆکی ڕێکخراوی ڕزگاریخوازی فەلەستین (PLO)؛ واژۆکردنی پەیماننامەی ئۆسلۆ و خەڵاتی نۆبڵی ئاشتی ١٩٩٤",difficulty:"medium"},{name:"گۆڵدا مەئیر",latin:"Golda Meir",hint:"چوارەم سەرۆک وەزیری ئیسرائیل و یەکەم ژن لەو پۆستەدا (١٩٦٩–١٩٧٤)؛ لە کاتی جەنگی یۆم کیپوور ١٩٧٣ حکومڕانی کرد؛ بە خاتوونی ئاسنین ناسرا",difficulty:"hard"},{name:"ماڵکۆم ئێکس",latin:"Malcolm X",hint:"وتاربێژ و چالاکوانی مافەکانی مرۆڤ و موسڵمانانی ئەمریکا لە دەیەی شەستەکان؛ پارێزەری مافی ڕەشپێستەکان؛ لە ١٩٦٥ تیرۆرکرا",difficulty:"medium"},{name:"ئایاتۆڵا خومەینی",latin:"Ruhollah Khomeini",hint:"ڕابەری شۆڕشی ئیسلامیی ئێران لە ١٩٧٩ کە کۆتایی بە دەسەڵاتی شای ئێران هێنا و کۆماری ئیسلامیی دامەزراند",difficulty:"medium"},{name:"مارگرێت تاچەر",latin:"Margaret Thatcher",hint:"یەکەم ژن سەرۆک وەزیرانی شانشینی یەکگرتوو (١٩٧٩–١٩٩٠)؛ نازناوی خاتوونی ئاسنین؛ سەرکەوتنی جەنگی فۆکلاند و ئابووریی بازاڕی ئازاد",difficulty:"medium"},{name:"میخائیل گۆرباچۆڤ",latin:"Mikhail Gorbachev",hint:"دوایین سەرکردەی یەکێتیی سۆڤیەت (١٩٨٥–١٩٩١)؛ گلاسنۆست و پێرێسترۆیکای پەرەپێدا؛ ڕێککەوتنی چەککەمکردنەوەی لەگەڵ ئەمریکا کرد و چاکسازییەکانی یارمەتیی کۆتایی هاتنی جەنگی ساردیان دا؛ نۆبڵی ئاشتی ١٩٩٠",difficulty:"medium"},{name:"بۆریس یێلتسین",latin:"Boris Yeltsin",hint:"یەکەم سەرۆکی هەڵبژێردراوی فیدراسیۆنی ڕووسیا دوای هەڵوەشاندنەوەی سۆڤیەت (١٩٩١–١٩٩٩)؛ ئابووریی بازاڕی بە شێوازی شۆک جێبەجێ کرد",difficulty:"hard"},{name:"دێنگ سیاۆپینگ",latin:"Deng Xiaoping",hint:"سەرکردەی باڵای چین دوای ماو؛ داڕێژەری چاکسازییە ئابوورییەکان و کرانەوەی چین بەڕووی جیهاندا؛ چینی کردە زلهێزێکی ئابووری",difficulty:"hard"},{name:"شاژن ئەلیزابێتی دووەم",latin:"Queen Elizabeth II",hint:"شاژنی شانشینی یەکگرتوو و وڵاتانی کۆمۆنوێڵس بۆ ٧٠ ساڵ و ٢١٤ ڕۆژ (١٩٥٢–٢٠٢٢)؛ درێژترین ماوەی پاشایەتی لە مێژووی بەریتانیا",difficulty:"easy"},{name:"شازادە دیانا",latin:"Princess Diana",hint:"شازادەی وێڵز و هاوسەری شازادە چارڵز؛ بە خاتوونی دڵەکان ناسرا بۆ کارە خێرخوازییەکانی دژ بە مین؛ لە ١٩٩٧ لە ڕووداوی ئۆتۆمبێل لە پاریس گیانی لەدەست دا",difficulty:"medium"},{name:"ئیندیرا گاندی",latin:"Indira Gandhi",hint:"یەکەم و تا ئێستا تاکە ژن سەرۆک وەزیرانی هیندستان؛ ١٩٦٦–١٩٧٧ و ١٩٨٠–١٩٨٤ خزمەتی کرد؛ کچی جەواهەرلال نەهرۆ؛ دوای ئۆپەراسیۆنی بلوو ستار لەلایەن دوو پاسەوانی سیخەوە تیرۆرکرا",difficulty:"medium"},{name:"بێنەزیر بوتۆ",latin:"Benazir Bhutto",hint:"یەکەم ژن کە بە هەڵبژاردن بووە سەرۆک وەزیری وڵاتێکی زۆرینە موسڵمان؛ دوو خول سەرۆک وەزیرانی پاکستان بوو؛ لە ٢٠٠٧ لە ڕاوەڵپیندی تیرۆرکرا",difficulty:"hard"},{name:"کۆوامی نکرومە",latin:"Kwame Nkrumah",hint:"ڕابەری سەربەخۆیی گانا؛ سەرۆک وەزیران بوو کاتێک وڵاتەکە لە ١٩٥٧ سەربەخۆ بوو و لە ١٩٦٠ بووە یەکەم سەرۆک کۆمار؛ پێشەنگی پەن-ئەفریقانیزم و لە دامەزرێنەرانی OAU",difficulty:"hard"},{name:"هایلێ سێلاسی",latin:"Haile Selassie",hint:"دوایین ئیمپراتۆری ئیتیۆپیا، ١٩٣٠–١٩٧٤ بە جیاوازیی ساڵانی داگیرکاریی ئیتاڵیا (١٩٣٦–١٩٤١)؛ لە دامەزراندنی ڕێکخراوی یەکێتیی ئەفریقا ڕۆڵی هەبوو؛ ڕاستافارییەکان پیرۆزی دەکەن",difficulty:"hard"},{name:"پاتریس لومۆمبا",latin:"Patrice Lumumba",hint:"یەکەم سەرۆک وەزیری کۆماری دیموکراتی کۆنگۆی سەربەخۆ لە ١٩٦٠ و ڕابەری دژە کۆلۆنیالیزم؛ لە کانوونی دووەمی ١٩٦١ بە دەستی نەیارە کۆنگۆییەکانی و بە هاوکاریی بەرپرسانی بەلجیکی کوژرا",difficulty:"hard"},{name:"نوسرەت فەتەح عەلی خان",latin:"Nusrat Fateh Ali Khan",hint:"گۆرانیبێژی پاکستانی و مامۆستای مۆسیقای سۆفیی قەوالی؛ بە دەنگی بەهێز و هاوکاری لەگەڵ هونەرمەندانی ڕۆژئاوایی قەوالیی بە گوێگری جیهانی ناساند",difficulty:"hard"},{name:"سیتینگ بوڵ",latin:"Sitting Bull",hint:"ڕابەری ڕۆحی و سیاسیی هەنکپاپا لاکۆتا؛ بەرخۆدانی لاکۆتا و شایێن دژی داگیرکردنی زەوییەکانیان یەکخست؛ لە کاتی سەرکەوتنی لیتڵ بیگ هۆرن ١٨٧٦ لە کەمپدا ڕۆڵی ڕۆحی هەبوو، نەک فەرماندەیی ڕاستەوخۆ",difficulty:"hard"},{name:"جیرۆنیمۆ",latin:"Geronimo",hint:"پیاوی ئایینی و جەنگاوەری چیریکاهوا ئەپاچی؛ دوای کوژرانی بنەماڵەکەی، بۆ دەیان ساڵ لە باکووری مەکسیک و باشووری ئەمریکا بەرخۆدان کرد؛ سەرۆکی فەرمیی هۆز نەبوو",difficulty:"hard"},{name:"پۆکاهۆنتاس",latin:"Pocahontas",hint:"کچی سەرکردەی پۆوهاتان لە ڤێرجینیا؛ ئینگلیزەکان لە ١٦١٣ دەستیان گرت، مەسیحی بوو و لەگەڵ جۆن ڕۆلف هاوسەرگیری کرد؛ چیرۆکی ڕزگارکردنی جۆن سمیت بەڵگەی دڵنیای نییە",difficulty:"medium"},{name:"ئیمیلیانۆ زاپاتا",latin:"Emiliano Zapata",hint:"ڕابەری جوتیارانی باشوور لە شۆڕشی مەکسیک؛ پلانی ئایالای لە ١٩١١ بۆ گەڕاندنەوەی زەوی نووسی؛ بە دروشمی زەوی و ئازادی ناسرا، هەرچەند ڕیکاردۆ فلۆرێس ماگۆن پێشتر دروشمەکەی بەکارهێنابوو",difficulty:"hard"}]},gp={id:"world-current",title:"کەسایەتییە بەناوبانگەکانی جیهانی ئەمڕۆ",subtitle:"سەرکردە، ئەستێرە، زانا و بازرگانی هاوچەرخی جیهان",emoji:"🌟",gradient:"from-cyan-500 via-blue-600 to-indigo-700",accent:"bg-cyan-400",cards:[{name:"دۆناڵد ترەمپ",latin:"Donald Trump",hint:"سەرۆکی ٤٥ەم و ٤٧ەمی ئەمریکا؛ خولی دووەمی لە ٢٠٢٥ دەستیپێکرد؛ ملیاردێری کەرتی بیناسازی و بازرگان",difficulty:"easy"},{name:"جۆ بایدن",latin:"Joe Biden",hint:"سەرۆکی ٤٦ەمی ئەمریکا ٢٠٢١–٢٠٢٥؛ پێشتر جێگری سەرۆک لەگەڵ ئۆباما و سیناتۆر بۆ ٣٦ ساڵ",difficulty:"easy"},{name:"باراک ئۆباما",latin:"Barack Obama",hint:"یەکەم سەرۆکی ڕەشپێستی ئەمریکا ٢٠٠٩–٢٠١٧؛ یاسای چاودێریی تەندروستی (ئۆباماکەیر)؛ خەڵاتی نۆبڵی ئاشتی ٢٠٠٩",difficulty:"easy"},{name:"کامالا هاریس",latin:"Kamala Harris",hint:"یەکەم ژن و یەکەم کەسی ڕەگەز ئاسیایی-ئەفریقی کە بووە جێگری سەرۆکی ئەمریکا ٢٠٢١–٢٠٢٥؛ کاندیدی سەرۆکایەتی ٢٠٢٤",difficulty:"medium"},{name:"هیلاری کلینتۆن",latin:"Hillary Clinton",hint:"وەزیری دەرەوەی ئەمریکا ٢٠٠٩–٢٠١٣؛ یەکەم ژن کاندیدی سەرۆکایەتی لە حیزبێکی گەورە ٢٠١٦؛ خاتوونی یەکەمی پێشوو",difficulty:"medium"},{name:"ڤلادیمیر پوتین",latin:"Vladimir Putin",hint:"سەرۆکی ڕووسیا لە ٢٠٠٠ەوە بە بڕانەوەیەک؛ پێشتر ئەفسەری کەی‌جی‌بی؛ هێرشی سەر ئۆکرانیا ٢٠٢٢",difficulty:"easy"},{name:"ڤۆلۆدیمیر زێلێنسکی",latin:"Volodymyr Zelenskyy",hint:"سەرۆکی ئۆکرانیا لە ٢٠١٩ەوە؛ پێشتر ئەکتەر و کۆمیدیان بوو؛ سەرکردایەتیی بەرگریی وڵات دژی هێرشی ڕووسیا",difficulty:"easy"},{name:"شی جینپینگ",latin:"Xi Jinping",hint:"سەرۆکی چین و سکرتێری گشتیی حیزبی کۆمۆنیست لە ٢٠١٢ەوە؛ پڕۆژەی کەمەربەند و ڕێگا",difficulty:"easy"},{name:"کیم جۆنگ ئون",latin:"Kim Jong Un",hint:"سەرکردەی کۆریای باکوور لە ٢٠١١ەوە؛ سێیەم نەوەی بنەماڵەی کیم؛ پرۆگرامی چەکی ناوکی",difficulty:"easy"},{name:"نارێندرا مۆدی",latin:"Narendra Modi",hint:"سەرۆک وەزیری هیندستان لە ٢٠١٤ەوە؛ سەرۆکی حیزبی بی‌جەی‌پی؛ پێشتر سەرۆک وەزیری گوجارات بوو",difficulty:"easy"},{name:"بنیامین نەتانیاهو",latin:"Benjamin Netanyahu",hint:"سەرۆک وەزیری ئیسرائیل؛ درێژترین ماوەی دەسەڵات لە مێژووی ئیسرائیل؛ سەرۆکی حیزبی لیکود",difficulty:"medium"},{name:"مەحمود عەباس",latin:"Mahmoud Abbas",hint:"سەرۆکی دەسەڵاتی فەلەستین لە ٢٠٠٥ەوە؛ سەرۆکی فەتح؛ نازناوی ئەبو مازن",difficulty:"medium"},{name:"ڕەجەب تەیب ئەردۆغان",latin:"Recep Tayyip Erdoğan",hint:"سەرۆکی تورکیا لە ٢٠١٤ەوە و سەرۆک وەزیری پێشوو؛ دامەزرێنەری حیزبی ئاک؛ شارەوانی پێشووی ئەستەمبوڵ",difficulty:"easy"},{name:"شا چارڵزی سێیەم",latin:"King Charles III",hint:"پاشای بەریتانیا لە ٢٠٢٢ەوە دوای مردنی دایکی؛ درێژترین شازادەی جێنشین لە مێژوو؛ چالاکی ژینگە",difficulty:"easy"},{name:"پاپ لیۆی چواردەیەم",latin:"Pope Leo XIV",hint:"پاپای کڵێسای کاتۆلیک لە ٢٠٢٥ەوە؛ یەکەم پاپی ئەمریکی (لە شیکاگۆ)؛ ماوەیەکی درێژ لە پیرۆ خزمەتی کرد؛ ناوی ڕەسەنی ڕۆبێرت پریڤۆست",difficulty:"medium"},{name:"پاپ فرانسس",latin:"Pope Francis",hint:"پاپای کڵێسای کاتۆلیک ٢٠١٣–٢٠٢٥؛ یەکەم پاپی ئەمریکای لاتین و یەکەم یەسوعی؛ خەمخۆری هەژاران و ژینگە؛ کۆچی دوایی نیسانی ٢٠٢٥",difficulty:"easy"},{name:"ئیمانوێل ماکرۆن",latin:"Emmanuel Macron",hint:"سەرۆکی فەرەنسا لە ٢٠١٧ەوە؛ گەنجترین سەرۆکی مێژووی فەرەنسا؛ پێشتر بانکەر و وەزیری ئابووری",difficulty:"easy"},{name:"فریدریش مێرتس",latin:"Friedrich Merz",hint:"شانسلێری ئەڵمانیا لە ٢٠٢٥ەوە؛ سەرۆکی حیزبی یەکێتیی دیموکراتی مەسیحی (CDU)",difficulty:"medium"},{name:"کیر ستارمەر",latin:"Keir Starmer",hint:"سەرۆک وەزیری بەریتانیا لە ٢٠٢٤ەوە؛ سەرۆکی حیزبی کرێکاران؛ پێشتر سەرۆکی دەستەی داواکاری گشتی",difficulty:"medium"},{name:"جۆرجیا مێلۆنی",latin:"Giorgia Meloni",hint:"یەکەم ژن سەرۆک وەزیری ئیتاڵیا لە ٢٠٢٢ەوە؛ سەرۆکی حیزبی برایانی ئیتاڵیا",difficulty:"medium"},{name:"مارک کارنی",latin:"Mark Carney",hint:"سەرۆک وەزیری کەنەدا لە ٢٠٢٥ەوە؛ پێشتر سەرۆکی بانکی کەنەدا و بانکی ئینگلتەرا",difficulty:"medium"},{name:"لی جای میۆنگ",latin:"Lee Jae-myung",hint:"سەرۆکی کۆریای باشوور لە ٢٠٢٥ەوە؛ پێشتر پارێزگاری گیۆنگی و شارەوانی سۆنگنام",difficulty:"medium"},{name:"لۆلا دا سیلڤا",latin:"Luiz Inácio Lula da Silva",hint:"سەرۆکی بەرازیل؛ پێشتر کرێکاری پیشەسازی و سەرۆکی سەندیکا؛ سێ خولی سەرۆکایەتی",difficulty:"medium"},{name:"خاڤیێر میلێی",latin:"Javier Milei",hint:"سەرۆکی ئەرجەنتین لە ٢٠٢٣ەوە؛ ئابووریناسی لیبرتاری؛ بە سیاسەتی قووڵی کەمکردنەوەی خەرجی ناسراوە",difficulty:"medium"},{name:"نەجیب بوکێلە",latin:"Nayib Bukele",hint:"سەرۆکی ئێلسالڤادۆر؛ شەڕی توندی دژی چەتەکان و یەکەم وڵات کە بیتکۆینی کردە دراوی فەرمی",difficulty:"medium"},{name:"نیکۆلاس مادورۆ",latin:"Nicolás Maduro",hint:"سەرۆکی ڤێنزوێلا لە ٢٠١٣ەوە دوای چاڤێز؛ سەردەمی قەیرانی ئابووری و کۆچی بەرفراوان",difficulty:"hard"},{name:"کلۆدیا شاینبام",latin:"Claudia Sheinbaum",hint:"یەکەم ژن سەرۆکی مەکسیک لە ٢٠٢٤ەوە؛ زانای کەشوهەوا و شارەوانی پێشووی مەکسیکۆ سیتی",difficulty:"medium"},{name:"گوستاڤۆ پێترۆ",latin:"Gustavo Petro",hint:"یەکەم سەرۆکی چەپڕەوی کۆلۆمبیا لە ٢٠٢٢ەوە؛ گەریلای پێشوو و شارەوانی پێشووی بۆگۆتا؛ تیشک دەخاتە سەر ژینگە و دادپەروەریی کۆمەڵایەتی",difficulty:"hard"},{name:"محەمەد بن سەلمان",latin:"Mohammed bin Salman (MBS)",hint:"شازادەی جێنشین و سەرۆک وەزیرانی سعوودیە؛ پڕۆژەی چاوەڕوانیی ٢٠٣٠ و شاری نیۆم",difficulty:"easy"},{name:"محەمەد بن زاید",latin:"Mohamed bin Zayed (MBZ)",hint:"سەرۆکی میرنشینە یەکگرتووە عەرەبییەکان لە ٢٠٢٢ەوە و میری ئەبووزەبی",difficulty:"medium"},{name:"تەمیم بن حەمەد",latin:"Tamim bin Hamad Al Thani",hint:"میری دەوڵەتی قەتەر لە ٢٠١٣ەوە؛ لە کاتی دەسەڵاتی ئەودا قەتەر میوانداریی مێژوویی جامی جیهانیی ٢٠٢٢ی کرد",difficulty:"medium"},{name:"عەبدولفەتاح سیسی",latin:"Abdel Fattah el-Sisi",hint:"سەرۆکی میسر لە ٢٠١٤ەوە؛ پێشتر فەرماندەی گشتیی سوپا؛ پڕۆژەی پایتەختی ئیداریی نوێ",difficulty:"medium"},{name:"پۆل کاگامێ",latin:"Paul Kagame",hint:"سەرۆکی ڕواندا لە ٢٠٠٠ەوە؛ سەرکردەی هێزەکانی کۆتایی‌هێنان بە جینۆسایدی ١٩٩٤",difficulty:"hard"},{name:"ویلیام روتۆ",latin:"William Ruto",hint:"سەرۆکی کینیا لە ٢٠٢٢ەوە؛ لە بنەماڵەیەکی هەژارەوە دەستی پێکرد و بە دروشمی پاڵپشتیی خەڵکی کرێکار (Hustler Nation) هەڵبژێردرا",difficulty:"hard"},{name:"سیریل ڕامافۆسا",latin:"Cyril Ramaphosa",hint:"سەرۆکی ئەفریقای باشوور لە ٢٠١٨ەوە؛ پێشتر سەرۆکی سەندیکای کانگاکان و هاوکاری ماندێلا",difficulty:"medium"},{name:"بۆلا تینوبو",latin:"Bola Tinubu",hint:"سەرۆکی نایجیریا لە ٢٠٢٣ەوە؛ پێشتر پارێزگاری لاگۆس؛ چاکسازیی لە سیستەمی دراو و سووتەمەنیی نایجیریا دەستپێکرد",difficulty:"hard"},{name:"ئەنتۆنیۆ گوتێرێس",latin:"António Guterres",hint:"سکرتێری گشتیی نەتەوە یەکگرتووەکان لە ٢٠١٧ەوە؛ پێشتر سەرۆک وەزیری پورتوگال",difficulty:"medium"},{name:"عەلی خامنەیی",latin:"Ali Khamenei",hint:"ڕابەری باڵای ئێران لە ١٩٨٩ەوە؛ پێشتر سەرۆک کۆمار؛ بەرزترین دەسەڵاتی سیاسی و ئایینی ئێران",difficulty:"medium"},{name:"مەسعوود پزیشکیان",latin:"Masoud Pezeshkian",hint:"سەرۆک کۆماری ئێران لە ٢٠٢٤ەوە؛ پزیشکی نەشتەرگەریی دڵ و وەزیری پێشووی تەندروستی؛ لە مەهاباد لەدایک بووە و خەڵکی تەورێزە",difficulty:"hard"},{name:"محەمەد شیاع سودانی",latin:"Mohammed Shia' al-Sudani",hint:"سەرۆک وەزیرانی عێراق لە تشرینی یەکەمی ٢٠٢٢ەوە؛ پارێزگاری پێشووی میسان و وەزیری چەندین وەزارەت",difficulty:"medium"},{name:"محەمەد یونس",latin:"Muhammad Yunus",hint:"ئابووریناسی بەنگلادیشی؛ دامەزرێنەری گرامین بانک و قەرزی بچووک؛ خەڵاتی نۆبڵی ئاشتی ٢٠٠٦",difficulty:"hard"},{name:"پرابۆوۆ سوبیانتۆ",latin:"Prabowo Subianto",hint:"سەرۆکی ئیندۆنیزیا لە ٢٠٢٤ەوە؛ پێشتر وەزیری بەرگری و ژەنەڕاڵی پێشووی سوپا",difficulty:"hard"},{name:"ئەنوەر ئیبراهیم",latin:"Anwar Ibrahim",hint:"سەرۆک وەزیری مالیزیا لە ٢٠٢٢ەوە؛ ساڵانێکی زۆر لە ئۆپۆزسیۆن و زیندان بوو",difficulty:"hard"},{name:"دالای لامای چواردەهەم",latin:"Dalai Lama (14th)",hint:"ڕابەری ڕۆحیی بۆدیستەکانی تبت؛ لە ١٩٥٩ەوە لە هیندستان لە تاراوگەیە؛ خەڵاتی نۆبڵی ئاشتی ١٩٨٩",difficulty:"medium"},{name:"ئانگ سان سووچی",latin:"Aung San Suu Kyi",hint:"سیاسەتمەداری میانمار؛ ١٥ ساڵ لە زیندانی ماڵەوە بوو؛ خەڵاتی نۆبڵی ئاشتی ١٩٩١",difficulty:"medium"},{name:"جاسیندا ئاردێرن",latin:"Jacinda Ardern",hint:"سەرۆک وەزیری نیوزیلاند ٢٠١٧–٢٠٢٣؛ بە بەڕێوەبردنی کۆڤید و هێرشی کرایست‌چێرچ ناسراوە",difficulty:"medium"},{name:"پێدرۆ سانچێس",latin:"Pedro Sánchez",hint:"سەرۆک وەزیری ئیسپانیا لە ٢٠١٨ەوە؛ سەرۆکی حیزبی سۆسیالیستی کرێکارانی ئیسپانیا",difficulty:"hard"},{name:"دۆناڵد توسک",latin:"Donald Tusk",hint:"سەرۆک وەزیری پۆڵەندا؛ پێشتر سەرۆکی ئەنجومەنی ئەوروپا (٢٠١٤–٢٠١٩) بوو؛ پۆڵەندای گەڕاندەوە ناو هاوپەیمانیی سەرەکیی ئەوروپا",difficulty:"hard"},{name:"ڤیکتۆر ئۆربان",latin:"Viktor Orbán",hint:"سەرۆک وەزیری هەنگاریا؛ بە سیاسەتی ناسیۆنالیستی و ململانێ لەگەڵ یەکێتیی ئەوروپا ناسراوە",difficulty:"hard"},{name:"مارک روتێ",latin:"Mark Rutte",hint:"سکرتێری گشتیی ناتۆ لە ٢٠٢٤ەوە؛ درێژترین سەرۆک وەزیری مێژووی هۆڵەندا",difficulty:"medium"},{name:"ئەحمەد شەرع",latin:"Ahmed al-Sharaa",hint:"سەرۆکی سوریا لە ٢٠٢٥ەوە؛ سەرکردەی هەیئەت تەحریری شام کە لە کانوونی یەکەمی ٢٠٢٤ ڕژێمی بەشار ئەسەدی ڕووخاند",difficulty:"medium"},{name:"بەشار ئەسەد",latin:"Bashar al-Assad",hint:"سەرۆکی پێشووی سوریا ٢٠٠٠–٢٠٢٤؛ لە شەڕی ناوخۆی سوریا؛ لە کانوونی یەکەمی ٢٠٢٤ ڕژێمەکەی ڕووخا و بۆ ڕووسیا هەڵات",difficulty:"medium"},{name:"سانائێ تاکائیچی",latin:"Sanae Takaichi",hint:"یەکەم ژن سەرۆک وەزیری ژاپۆن لە ٢٠٢٥ەوە؛ سەرۆکی حیزبی لیبڕاڵ دیموکرات؛ سیاسەتمەدارێکی کۆنسێرڤەتیڤ",difficulty:"medium"},{name:"سانا مارین",latin:"Sanna Marin",hint:"سەرۆک وەزیری پێشووی فینلەند ٢٠١٩–٢٠٢٣؛ لە کاتی هەڵبژاردن گەنجترین سەرۆک وەزیری جیهان بوو؛ فینلەندی خستە ناتۆوە",difficulty:"hard"},{name:"ئیلۆن ماسک",latin:"Elon Musk",hint:"دەوڵەمەندترین کەسی جیهان؛ سەرۆکی تێسلا و سپەیس ئێکس؛ خاوەنی ئێکس (تویتەر)؛ نیوڕالینک",difficulty:"easy"},{name:"جێف بیزۆس",latin:"Jeff Bezos",hint:"دامەزرێنەری ئەمازۆن ١٩٩٤ لە گەراجەکەی؛ خاوەنی بلو ئۆریجین و ڕۆژنامەی واشنتن پۆست",difficulty:"easy"},{name:"بیڵ گەیتس",latin:"Bill Gates",hint:"هاودامەزرێنەری مایکرۆسۆفت؛ گەورەترین خێرخوازی جیهان بە دامەزراوەی گەیتس؛ خەبات دژی مەلاریا و پۆلیۆ",difficulty:"easy"},{name:"مارک زەکەربێرگ",latin:"Mark Zuckerberg",hint:"دامەزرێنەری فەیسبووک لە خوێندنگای هارڤارد؛ ئێستا سەرۆکی مێتا (ئینستاگرام و واتسئاپ)",difficulty:"easy"},{name:"سام ئۆڵتمان",latin:"Sam Altman",hint:"سەرۆکی ئۆپن ئەی ئای؛ بەرپرسی دەرکردنی چات جی پی تی کە شۆڕشی هۆشی دەستکردی هێنایە ئاراوە",difficulty:"easy"},{name:"سوندار پیتچای",latin:"Sundar Pichai",hint:"سەرۆکی گۆگڵ و ئەلفابێت؛ لە هیندستانەوە دەستی بە کار کرد و بەرپرسی کرۆم و ئەندرۆید بوو",difficulty:"medium"},{name:"تیم کوک",latin:"Tim Cook",hint:"سەرۆکی ئەپڵ لە ٢٠١١ەوە دوای ستیڤ جۆبز؛ ئەپڵی کردە یەکەم کۆمپانیای تریلیۆن دۆلاری",difficulty:"medium"},{name:"ساتیا نادێلا",latin:"Satya Nadella",hint:"سەرۆکی مایکرۆسۆفت لە ٢٠١٤ەوە؛ کۆمپانیای بەرەو کلاود و هۆشی دەستکرد بردەوە",difficulty:"medium"},{name:"جێنسن هوانگ",latin:"Jensen Huang",hint:"دامەزرێنەر و سەرۆکی ئێنڤیدیا؛ ",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Masrour_Barzani_Munich_2020.jpg/440px-Masrour_Barzani_Munich_2020.jpg"},{name:"بافل تاڵەبانی",latin:"Bafel Talabani",hint:"سەرۆکی یەکێتیی نیشتمانیی کوردستان؛ کوڕی مام جەلال و هێرۆ خان؛ لە ٢٠٢٠ هاوسەرۆک و لە ٢٠٢١ەوە تاکە سەرۆکی یەکێتییە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Bafel_Talabani.jpg/440px-Bafel_Talabani.jpg"},{name:"قوباد تاڵەبانی",latin:"Qubad Talabani",hint:"جێگری سەرۆک وەزیرانی هەرێمی کوردستان؛ کوڕی بچووکی مام جەلال؛ پێشتر نوێنەری هەرێم لە واشنتن",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Qubad_Talabani_2017.jpg/440px-Qubad_Talabani_2017.jpg"},{name:"نەوشیروان مستەفا",latin:"Nawshirwan Mustafa",hint:"دامەزرێنەری بزووتنەوەی گۆڕان (٢٠٠٩)؛ پێشتر جێگری سکرتێری گشتیی یەکێتی؛ مێژوونووس و نووسەری چەندین کتێبی سیاسی",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Nawshirwan_Mustafa.jpg/440px-Nawshirwan_Mustafa.jpg"},{name:"بەرهەم ساڵح",latin:"Barham Salih",hint:"سەرۆک کۆماری عێراق ٢٠١٨–٢٠٢٢؛ سەرۆک وەزیرانی پێشووی هەرێم؛ دامەزرێنەری زانکۆی ئەمریکی سلێمانی",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Barham_Salih_2019.jpg/440px-Barham_Salih_2019.jpg"},{name:"فوئاد مەعسوم",latin:"Fuad Masum",hint:"سەرۆکی پێشووی عێراق (٢٠١٤–٢٠١٨)؛ یەکێکە لە دامەزرێنەرانی یەکێتیی نیشتمانیی کوردستان؛ مامۆستای پێشووی زانکۆ",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Fuad_Masum_2014.jpg/440px-Fuad_Masum_2014.jpg"},{name:"لەتیف ڕەشید",latin:"Abdul Latif Rashid",hint:"سەرۆک کۆماری عێراق ٢٠٢٢–٢٠٢٦؛ ئەندازیاری ئاو و وەزیری پێشووی سەرچاوەکانی ئاوی عێراق",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Abdul_Latif_Rashid.jpg/440px-Abdul_Latif_Rashid.jpg"},{name:"نزار ئامیدی",latin:"Nizar Amidi",hint:"سەرۆک کۆماری عێراق لە نیسانی ٢٠٢٦ەوە و جێگری لەتیف ڕەشید؛ کاندیدی یەکێتیی نیشتمانی و وەزیری پێشووی ژینگەی عێراق",difficulty:"medium"},{name:"هۆشیار زێباری",latin:"Hoshyar Zebari",hint:"وەزیری دەرەوەی عێراق ٢٠٠٣–٢٠١٤ و پاشان وەزیری دارایی؛ سەرکردەی باڵای پارتی و یەکێک لە دیپلۆماتە ناسراوەکانی کورد",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Hoshyar_Zebari_2012.jpg/440px-Hoshyar_Zebari_2012.jpg"},{name:"کۆسرەت ڕەسوڵ",latin:"Kosrat Rasul",hint:"فەرماندەی پێشمەرگە و یەکێک لە ڕزگارکەرانی هەولێر لە ڕاپەڕینی ١٩٩١؛ دووەم سەرۆک وەزیرانی هەرێمی کوردستان ١٩٩٣–٢٠٠١؛ جێگری سەرۆکی هەرێم ٢٠٠٥–٢٠١٧؛ ئێستا سەرۆکی ئەنجومەنی باڵای سیاسیی یەکێتی",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Kosrat_Rasul_Ali.jpg/440px-Kosrat_Rasul_Ali.jpg"},{name:"هێرۆ ئیبراهیم ئەحمەد",latin:"Hero Ibrahim Ahmad",hint:"خاتوونی یەکەمی عێراق ٢٠٠٥–٢٠١٤؛ هاوسەری مام جەلال؛ کچی نووسەر ئیبراهیم ئەحمەد؛ دامەزرێنەری کەناڵی کوردسات",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Hero_Ibrahim_Ahmad.jpg/440px-Hero_Ibrahim_Ahmad.jpg"},{name:"شاناز ئیبراهیم ئەحمەد",latin:"Shanaz Ibrahim Ahmad",hint:"خاتوونی یەکەمی عێراق ٢٠٢٢–٢٠٢٦؛ هاوسەری لەتیف ڕەشید؛ کچی نووسەر ئیبراهیم ئەحمەد و خوشکی هێرۆ",difficulty:"hard"},{name:"سامی عەبدولڕەحمان",latin:"Sami Abdulrahman",hint:"جێگری سەرۆک وەزیرانی هەرێم لە ١٩٩٩ەوە؛ لە تەقینەوەی جەژنی هەولێر ١ی شوباتی ٢٠٠٤ لەگەڵ کوڕەکەی شەهید بوو؛ گەورەترین پارکی هەولێر بە ناویەوەیە",difficulty:"medium"},{name:"فرانسۆ حەریری",latin:"Franso Hariri",hint:"سیاسەتمەداری ئاشووریی ئەندامی پارتی؛ پارێزگاری هەولێر ١٩٩٦–٢٠٠١؛ لە ١٨ی شوباتی ٢٠٠١ تیرۆرکرا؛ یاریگای فرانسۆ حەریری بە ناویەوەیە",difficulty:"medium"},{name:"ڕۆژ نوری شاوەیس",latin:"Roj Nuri Shawais",hint:"دووەم سەرۆکی پەرلەمانی کوردستان؛ جێگری سەرۆک وەزیرانی عێراق چەند خولێک",difficulty:"medium"},{name:"جەوهەر نامق سالم",latin:"Jawhar Namiq Salim",hint:"یەکەم سەرۆکی پەرلەمانی کوردستان؛ پێشمەرگە و ئەندامی مەکتەبی سیاسیی پارتی",difficulty:"hard"},{name:"عەدنان موفتی",latin:"Adnan Mufti",hint:"سەرۆکی پەرلەمانی کوردستان ٢٠٠٥–٢٠٠٩؛ ئەندامی مەکتەبی سیاسیی یەکێتی؛ وەزیری پێشووی ڕۆشنبیری",difficulty:"hard"},{name:"فەزڵ میرانی",latin:"Fazil Mirani",hint:"سکرتێری مەکتەبی سیاسیی پارتی دیموکراتی کوردستان بۆ ماوەیەکی درێژ",difficulty:"hard"},{name:"کەریم سنجاری",latin:"Karim Sinjari",hint:"چەند جارێک وەزیری ناوخۆی هەرێمی کوردستان بووە؛ ئەندامی مەکتەبی سیاسی پارتی",difficulty:"hard"},{name:"ڕێبوار ئەحمەد",latin:"Rebar Ahmed",hint:"وەزیری ناوخۆی هەرێمی کوردستان لە کابینەی نۆیەم؛ کاندیدی پێشووی سەرۆک کۆماری عێراق لەلایەن پارتییەوە",difficulty:"medium"},{name:"هێمن هەورامی",latin:"Hemin Hawrami",hint:"جێگری سەرۆکی پەرلەمانی کوردستان؛ بەرپرسی پێشووی پەیوەندییە دەرەوەکانی پارتی؛ خاوەنی دکتۆرا و چەندین کتێبی سیاسی",difficulty:"hard"},{name:"کوێستان محەمەد",latin:"Kwestan Mohammed",hint:"پەرلەمانتار و وەزیری کار و کاروباری کۆمەڵایەتی لە کابینەی نۆیەم؛ لە سەرکردایەتیی گۆڕان",difficulty:"hard"},{name:"نەجمەدین کەریم",latin:"Najmaldin Karim",hint:"پارێزگاری پێشووی کەرکووک؛ نەشتەرگەری دەماری مێشک لە ئەمریکا",difficulty:"medium"},{name:"خالید شوانی",latin:"Khalid Shwani",hint:"سیاسەتمەدار و پارێزەری کەرکووک؛ وەزیری داد لە حکومەتی عێراق و پێشتر وەزیری دەوڵەت بۆ دانوستانەکانی هەرێم و بەغدا؛ ئەندامی یەکێتیی نیشتمانی",difficulty:"hard"},{name:"ئومێد خۆشناو",latin:"Omed Khoshnaw",hint:"پارێزگاری هەولێر؛ لە شوباتی ٢٠٢١ سوێندی یاسایی خوارد؛ پێشتر سەرۆکی فراکسیۆنی پارتی لە پەرلەمانی کوردستان",difficulty:"hard"},{name:"هەڤاڵ ئەبوبەکر",latin:"Haval Abubakir",hint:"پارێزگاری سلێمانی؛ مامۆستای پێشووی زانکۆ و نووسەر",difficulty:"hard"},{name:"ئازاد بەرزنجی",latin:"Azad Barzinji",hint:"وەرگێڕ و ڕۆشنبیری ناوداری کورد لە سلێمانی؛ زیاتر لە ٣٥ کتێبی فەلسەفە و ئەدەبی جیهانیی وەرگێڕاوەتە سەر کوردی",difficulty:"hard"},{name:"جەبار یاوەر",latin:"Jabbar Yawar",hint:"سکرتێری گشتیی پێشووی وەزارەتی پێشمەرگە بۆ ١٧ ساڵ و وتەبێژی ناسراوی هێزەکان؛ ئێستا شارەزای کاروباری ئاسایشە",difficulty:"hard"},{name:"مەلا بەختیار",latin:"Mala Bakhtiar",hint:"ناوی ڕاستەقینەی حیکمەت محەمەد کەریم؛ هاوسەرۆکی ئەنجومەنی باڵای سیاسیی یەکێتی لەگەڵ کۆسرەت ڕەسوڵ؛ فەرماندەی پێشمەرگە؛ نووسەر و شیکەرەوەی سیاسی",difficulty:"medium"},{name:"سەعدی ئەحمەد پیرە",latin:"Saadi Ahmad Pira",hint:"وتەبێژی مەکتەبی سیاسیی یەکێتیی نیشتمانیی کوردستان؛ ئەندامی کۆنی سەرکردایەتیی یەکێتی",difficulty:"hard"},{name:"مەحمود سەنگاوی",latin:"Mahmud Sangawi",hint:"فەرماندەی دێرینی پێشمەرگە و سەرکردەی یەکێتی؛ بەرپرسی میحوەری گەرمەسێر لە شەڕی دژ بە داعش",difficulty:"hard"},{name:"ئاراس شێخ جەنگی",latin:"Aras Sheikh Jangi",hint:"کوڕەزای مام جەلال؛ سەرکردەی پێشووی دەزگای زانیاریی یەکێتی؛ لە ٢٠٢٥ جیابووەوە و چووە بەرەی گەل",difficulty:"medium"},{name:"لاهور شێخ جەنگی",latin:"Lahur Sheikh Jangi",hint:"سەرۆکی بەرەی گەل و هاوسەرۆکی پێشووی یەکێتی؛ سەرۆکی پێشووی دەزگای پاراستن؛ لە ٢٢ی ئابی ٢٠٢٥ دوای شەڕی هوتێلی لالەزار لە سلێمانی دەستگیرکرا",difficulty:"medium"},{name:"شاسوار عەبدولواحید",latin:"Shaswar Abdulwahid",hint:"بازرگان و خاوەنی تۆڕی میدیایی NRT؛ دامەزرێنەری بزووتنەوەی نەوەی نوێ لە ٢٠١٧؛ لە ئابی ٢٠٢٥ دەستگیرکرا و بە پێنج مانگ زیندان حوکم درا",difficulty:"medium"},{name:"سروە عەبدولواحید",latin:"Srwa Abdulwahid",hint:"سەرۆکی فراکسیۆنی نەوەی نوێ لە پەرلەمانی عێراق لە بەغدا؛ خوشکی شاسوار عەبدولواحید",difficulty:"medium"},{name:"عەلی باپیر",latin:"Ali Bapir",hint:"دامەزرێنەر و سەرۆکی کۆمەڵی نیشتمانیی کوردستان (٢٠٠١)؛ مامۆستای ئایینی و نووسەر؛ لە ٢٠٠٣ لەلایەن هێزەکانی ئەمریکا دەستگیرکرا و دواتر ئازادکرا",difficulty:"medium"},{name:"سەڵاحەدین بەهائەدین",latin:"Salahaddin Bahaaeddin",hint:"لە دامەزرێنەرانی یەکگرتووی ئیسلامیی کوردستان لە ٦ی شوباتی ١٩٩٤؛ سکرتێری گشتیی یەکگرتوو بۆ زیاتر لە ٢٦ ساڵ",difficulty:"medium"},{name:"محەمەد حاجی مەحمود",latin:"Muhammad Haji Mahmud",hint:"سکرتێری حیزبی سۆسیالیست دیموکراتی کوردستان؛ فەرماندەی پێشمەرگە، نازناوی کاک محەمەد",difficulty:"medium"},{name:"سیروان بارزانی",latin:"Sirwan Barzani",hint:"فەرماندەی پێشمەرگە لە بەرەی گوێر دژی داعش؛ دامەزرێنەری کۆمپانیای کۆرەک تێلێکۆم",difficulty:"medium"},{name:"مەنسوور بارزانی",latin:"Mansour Barzani",hint:"فەرماندەی لەشکری تایبەتی پێشمەرگە (گولان)؛ کوڕی مەسعود بارزانی؛ فەرماندەی شەڕەکانی دژی داعش",difficulty:"medium"},{name:"کەمال کەرکووکی",latin:"Kamal Kirkuki",hint:"سەرۆکی پەرلەمانی کوردستان ٢٠٠٩–٢٠١٢؛ سەرکردەی پارتی لە کەرکووک و پێشمەرگەی کۆن",difficulty:"hard"},{name:"ڤیان دەخیل",latin:"Vian Dakhil",hint:"پەرلەمانتاری ئێزیدی لە پەرلەمانی عێراق؛ لە ئابی ٢٠١٤ بە قسە گریانەکەی لە پەرلەمان جیهانی ئاگادار کردەوە لە کارەساتی شەنگال",difficulty:"medium"},{name:"نادیە موراد",latin:"Nadia Murad",hint:"چالاکوانی ئێزیدی؛ خەڵاتی نۆبڵی ئاشتی ٢٠١٨ی لەگەڵ دێنی موکوێگێ بردەوە بۆ خەبات دژی توندوتیژیی سێکسی وەک چەکی جەنگ؛ کتێبی دوایین کچ",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Nadia_Murad_Basecamp_2018.jpg/440px-Nadia_Murad_Basecamp_2018.jpg"},{name:"تەحسین سەعید بەگ",latin:"Tahsin Said Beg",hint:"میری ئێزیدییەکانی جیهان لە ١٩٤٤ەوە تا ٢٠١٩؛ لە ١١ ساڵیدا بوو بە میر؛ سەرۆکی ئەنجومەنی ڕۆحانیی ئێزیدییان",difficulty:"hard"},{name:"عەبدوڵڵا ئۆجەلان",latin:"Abdullah Öcalan",hint:"دامەزرێنەری پەکەکە (١٩٧٨)؛ لە ١٩٩٩ لە کینیا دەستگیرکرا و لە دوورگەی ئیمراڵی زیندانییە؛ لە ٢٠٢٥ بانگەوازی هەڵوەشاندنەوەی پەکەکە و کۆتاییهێنان بە شەڕی چەکداری کرد و پەکەکە بڕیاری هەڵوەشاندنەوەی ڕاگەیاند",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Abdullah_%C3%96calan.jpg/440px-Abdullah_%C3%96calan.jpg"},{name:"سەلاحەدین دەمیرتاش",latin:"Selahattin Demirtaş",hint:"هاوسەرۆکی پێشووی هەدەپە و کاندیدی سەرۆکایەتیی تورکیا؛ پارێزەر و نووسەر؛ لە ٢٠١٦ەوە زیندانی کراوە و لە ئایاری ٢٠٢٤ بە ٤٢ ساڵ زیندان حوکم درا",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Selahattin_Demirta%C5%9F.jpg/440px-Selahattin_Demirta%C5%9F.jpg"},{name:"لەیلا زانا",latin:"Leyla Zana",hint:"یەکەم ژنی کورد لە پەرلەمانی تورکیا ١٩٩١؛ بۆ سوێندخواردن بە کوردی زیندانی کرا؛ خەڵاتی ساخارۆڤ ١٩٩٥",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Leyla_Zana_2008.jpg/440px-Leyla_Zana_2008.jpg"},{name:"ئەحمەد تۆرک",latin:"Ahmet Türk",hint:"سیاسەتمەداری بەتەمەنی کورد؛ چەند جارێک شارەوانی ماردین بووە و هەر جارێک بە قەیوم لابراوە؛ لە دادگای کۆبانێ بە ١٠ ساڵ زیندان حوکم درا",difficulty:"hard"},{name:"عوسمان بایدەمیر",latin:"Osman Baydemir",hint:"شارەوانی ئامەد (دیاربەکر) ٢٠٠٤–٢٠١٤ و پەرلەمانتار؛ لە ٢٠١٨ ئەندامێتیی پەرلەمانی لێسەندرایەوە؛ ئێستا لە لەندەن لە تاراوگەیە",difficulty:"hard"},{name:"پەروین بولدان",latin:"Pervin Buldan",hint:"هاوسەرۆکی پێشووی هەدەپە؛ ئەندامی هەیئەتی دانوستانی ئاشتی لە تورکیا",difficulty:"hard"},{name:"میتهات سانجار",latin:"Mithat Sancar",hint:"هاوسەرۆکی پێشووی هەدەپە (٢٠٢٠–٢٠٢٣)؛ پرۆفیسۆری یاسای دەستووری لە زانکۆی ئەنقەرە",difficulty:"hard"},{name:"گولتان کشاناک",latin:"Gültan Kışanak",hint:"یەکەم ژن کە بووە هاوشارەوانی ئامەد (دیاربەکر)؛ ڕۆژنامەنووس و چالاکوانی مافی ژنان؛ لە ٢٠١٦ زیندانی کرا و لە ئایاری ٢٠٢٤ دوای حوکمی ١٢ ساڵ ئازاد کرا",difficulty:"hard"},{name:"سەباحەت تونجەل",latin:"Sebahat Tuncel",hint:"پەرلەمانتار و هاوسەرۆکی پێشووی حیزبی دیموکراتیکی گەلان؛ لە ٢٠٠٧ کە لە زیندان بوو بۆ پەرلەمانی تورکیا هەڵبژێردرا؛ چالاکوانی مافی ژنان",difficulty:"hard"},{name:"فیگەن یوکسەکداغ",latin:"Figen Yüksekdağ",hint:"هاوسەرۆکی پێشووی هەدەپە شانبەشانی دەمیرتاش؛ لە ٢٠١٦ دەستگیرکرا و لە ئایاری ٢٠٢٤ بە ٣٠ ساڵ زیندان حوکم درا",difficulty:"hard"},{name:"مەزڵوم عەبدی",latin:"Mazloum Abdi",hint:"فەرماندەی گشتیی هێزەکانی سوریای دیموکرات (SDF)؛ سەرکردەی شەڕی زەمینی دژی داعش لە کۆبانێ و ڕەققە",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Mazloum_Abdi.jpg/440px-Mazloum_Abdi.jpg"},{name:"ساڵح موسلیم",latin:"Salih Muslim",hint:"هاوسەرۆکی پێشووی پەیەدە لە ڕۆژئاڤا؛ ئەندازیاری کیمیا بە پیشە؛ دیپلۆماتی نێودەوڵەتیی کوردی ڕۆژئاڤا",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Salih_Muslim_Muhammad.jpg/440px-Salih_Muslim_Muhammad.jpg"},{name:"ئیلهام ئەحمەد",latin:"Ilham Ahmed",hint:"سیاسەتمەداری ژن لە ڕۆژئاڤا؛ بەرپرسی پەیوەندییە دەرەوەکانی ئیدارەی خۆسەری باکوور و ڕۆژهەڵاتی سوریا",difficulty:"hard",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Ilham_Ehmed.jpg/440px-Ilham_Ehmed.jpg"},{name:"فۆزا یوسف",latin:"Foza Yusif",hint:"هاوسەرۆکی پێشووی پەیەدە؛ لە دامەزرێنەرانی سیستەمی ئیدارەی خۆسەری ڕۆژئاڤا",difficulty:"hard"},{name:"ئەلدار خەلیل",latin:"Aldar Khalil",hint:"یەکێک لە دامەزرێنەرانی TEV-DEM و سیستەمی ئیدارەی خۆسەر لە ڕۆژئاڤا",difficulty:"hard"},{name:"سادق شەرەفکەندی",latin:"Sadegh Sharafkandi",hint:"سکرتێری گشتیی حیزبی دیموکراتی کوردستانی ئێران دوای قاسملوو؛ لە ١٩٩٢ لە چێشتخانەی میکۆنۆسی بەرلین تیرۆرکرا",difficulty:"medium"},{name:"مستەفا هیجری",latin:"Mustafa Hijri",hint:"سکرتێری گشتیی حیزبی دیموکراتی کوردستانی ئێران لە ٢٠٠٤ەوە؛ خەباتکاری دێرینی ڕۆژهەڵات",difficulty:"hard"},{name:"عەبدوڵڵا موهتەدی",latin:"Abdullah Mohtadi",hint:"سکرتێری گشتیی کۆمەڵەی شۆڕشگێڕی زەحمەتکێشانی کوردستانی ئێران لە دامەزراندنیەوە لە ١٩٧٩",difficulty:"medium"},{name:"شڤان پەروەر",latin:"Şivan Perwer",hint:"ناوداترین گۆرانیبێژی کورمانجی؛ لە ١٩٧٦ەوە لە تاراوگە ژیا؛ گۆرانی کینێ ئەم و هەلەپچە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Sivan_Perwer_2011.jpg/440px-Sivan_Perwer_2011.jpg"},{name:"ئەحمەد کایا",latin:"Ahmet Kaya",hint:"گۆرانیبێژی کوردی تورکیا؛ دوای ڕاگەیاندنی کوردایەتی لە ١٩٩٩ چووە تاراوگە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Ahmet_Kaya.jpg/440px-Ahmet_Kaya.jpg"},{name:"ناسر ڕەزازی",latin:"Nasser Razazi",hint:"گۆرانیبێژی شۆڕشگێڕی ڕۆژهەڵات لە سنە؛ دەیان گۆرانی نیشتمانی تۆمار کردووە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Naser_Razazi.jpg/440px-Naser_Razazi.jpg"},{name:"مەزهەر خالقی",latin:"Mazhar Khaleqi",hint:"گۆرانیبێژی گەورەی کورد لە سنە؛ زیاتر لە ١٥٠ پارچە مۆسیقای فۆلکلۆری کوردی تۆمار کردووە",difficulty:"medium"},{name:"زەکەریا عەبدوڵڵا",latin:"Zakaria Abdulla",hint:"گۆرانیبێژی کورد لە هەولێر؛ چەندین ئەلبومی پۆپی کوردی بڵاوکردووەتەوە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Zakaria_Abdulla.jpg/440px-Zakaria_Abdulla.jpg"},{name:"عەدنان کەرەم",latin:"Adnan Karim",hint:"گۆرانیبێژی سلێمانی و وێنەکێش؛ شیعرەکانی نالی، مەحوی و پیرەمێرد بە مەقامی کوردی دەڵێتەوە",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Adnan_Karim.jpg/440px-Adnan_Karim.jpg"},{name:"چۆپی فەتاح",latin:"Chopy Fatah",hint:"گۆرانیبێژی ژنی کورد لە کەرکووک؛ لە ناسراوترین دەنگە ژنانەکانی پۆپی کوردی",difficulty:"medium",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Chopy_Fatah.jpg/440px-Chopy_Fatah.jpg"},{name:"هەڵکەوت زاهیر",latin:"Halkawt Zaher",hint:"ئاوازدانەر و ژەنیاری بەتوانای سلێمانی؛ یەکێکە لە بەرهەمهێنەرترین ئاوازدانەرانی مۆسیقای کوردی",difficulty:"medium"},{name:"دەشنێ موراد",latin:"Dashni Morad",hint:"گۆرانیبێژی پۆپ و پێشکەشکاری تەلەفزیۆن؛ لە هۆڵەندا گەورە بووە؛ چالاکوانی مافی ژنان و ژینگە",difficulty:"medium"},{name:"دیار دەرسیم",latin:"Diyar Dersim",hint:"گۆرانیبێژی شۆڕشگێڕی کورد لە باکووری کوردستان، خەڵکی دەرسیم؛ بە کورمانجی و زازاکی دەیان ئەلبومی بڵاوکردووەتەوە لە ١٩٨٨ەوە",difficulty:"medium"},{name:"ڕۆژین",latin:"Rojin",hint:"گۆرانیبێژ و ئەکتەری ژنی کورد لە باکوور؛ پێشکەشکاری بەرنامەی کوردی لە کەناڵی TRT بوو",difficulty:"medium"},{name:"ئاینور دۆغان",latin:"Aynur Doğan",hint:"گۆرانیبێژی ژنی کورد لە دەرسیم؛ گۆرانی کەچە کوردان؛ لە فیستیڤاڵە جیهانییەکان بەشداری کردووە",difficulty:"medium"},{name:"جوان حاجۆ",latin:"Ciwan Haco",hint:"گۆرانیبێژی کورد؛ یەکەم کەس بوو ڕۆک و جاز و پۆپی تێکەڵ بە مۆسیقای کوردی کرد",difficulty:"medium"},{name:"مەم ئارارات",latin:"Mem Ararat",hint:"گۆرانیبێژ و ئاوازدانەری کورمانجی لە ماردین؛ گۆرانییەکانی بۆ زمان و ناسنامەی کوردین؛ چەند کۆنسێرتێکی لە تورکیا قەدەغە کران",difficulty:"medium"},{name:"نیزامەدین ئاریچ",latin:"Nizamettin Ariç",hint:"گۆرانیبێژ و دەرهێنەری کورد؛ دەرهێنەر و ئەکتەری سەرەکیی فیلمی «کلامێک بۆ بێکۆ» (١٩٩٢)، یەکەم فیلمی درێژی کوردی؛ لە ١٩٨١ەوە لە بەرلین دەژی",difficulty:"hard"},{name:"ئارام تیگران",latin:"Aram Tigran",hint:"گۆرانیبێژی ئەرمەنی کە بە کوردی گۆرانیی دەگوت؛ دەنگێکی خۆشەویست لای کوردان",difficulty:"hard"},{name:"شەهرام نازری",latin:"Shahram Nazeri",hint:"گۆرانیبێژی کورد لە کرماشان؛ بە شیعری ڕۆمی و مۆسیقای کلاسیکی ئێرانی جیهانی ناسراوە",difficulty:"medium"},{name:"کەیهان کەلهوڕ",latin:"Kayhan Kalhor",hint:"ژەنیاری کەمانچەی کورد؛ لە ٢٠١٧ لەگەڵ گرووپی ڕێگای ئاوریشمی یۆ یۆ ما خەڵاتی گرامیی بردەوە بۆ ئەلبومی Sing Me Home",difficulty:"hard"},{name:"کامکاران",latin:"Kamkars",hint:"گرووپی مۆسیقای بنەماڵەیی کورد لە سنە؛ پێکهاتووە لە خوشک و برایان؛ ناسراو لە ئاستی جیهان",difficulty:"medium"},{name:"هێڵی لوڤ",latin:"Helly Luv",hint:"گۆرانیبێژی پۆپی کورد؛ کلیپی ڕیسک ئیت ئۆڵ و ڕیڤۆلوشن لە بەرەکانی شەڕی داعش تۆمار کرد",difficulty:"hard"},{name:"هۆزان دیار",latin:"Hozan Diyar",hint:"گۆرانیبێژی فۆلکلۆر و پۆپی ناوداری کورد لە باکووری کوردستان؛ دەیان گۆرانی بە کورمانجی تۆمار کردووە",difficulty:"medium"},{name:"کاروان کامیل",latin:"Karwan Kamil",hint:"گۆرانیبێژی کورد لە دهۆک؛ گۆرانییەکانی بە ملیۆنەها بینەر لە یوتیوب بینراون",difficulty:"medium"},{name:"سەڕهادو",latin:"Serhado",hint:"یەکێکە لە پێشەنگانی ڕاپی کوردی لە سوید؛ گۆرانییەکانی بۆ زمان و ناسنامەی کوردین",difficulty:"medium"},{name:"ڕیزان سەعید",latin:"Rizan Said",hint:"ئاوازدانەر و ژەنیاری کورد لە ڕەس ئەلعینی سوریا؛ ئاوازی دەیان گۆرانی بەناوبانگی کوردی و بەرهەمی تەلەفزیۆنی داناوە",difficulty:"hard"},{name:"شێرکۆ بێکەس",latin:"Sherko Bekas",hint:"گەورەترین شاعیری نوێخوازی کورد (١٩٤٠–٢٠١٣)؛ کوڕی فایەق بێکەس؛ دامەزرێنەری ڕەوتی ڕوانگە (١٩٧٠)؛ لە ١٩٨٧ خەڵاتی توخۆلسکیی سویدی بردەوە",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Sherko_Bekas.jpg/440px-Sherko_Bekas.jpg"},{name:"بەختیار عەلی",latin:"Bachtyar Ali",hint:"ڕۆماننووسی ناوداری کورد؛ خاوەنی «ئێوارەی پەروانە» و «دوا هەناری دنیا»؛ لە ئەڵمانیا دەژی؛ یەکەم نووسەری کورد کە خەڵاتی نێلی زاکسی بردەوە (٢٠١٧)",difficulty:"easy",image:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Bachtyar_Ali_2017.jpg/440px-Bachtyar_Ali_2017.jpg"},{name:"عەبدوڵڵا پەشێو",latin:"Abdulla Pashew",hint:"شاعیری خۆشەویستی کورد؛ شیعرەکانی بۆ چەند زمانێک وەرگێڕدراون",difficulty:"medium"},{name:"لەتیف هەڵمەت",latin:"Latif Halmat",hint:"شاعیری نوێخوازی کورد لە کەرکووک؛ یەکێک لە دەنگە سەرەکییەکانی شیعری نوێی کوردی",difficulty:"medium"},{name:"ڕەفیق سابیر",latin:"Rafiq Sabir",hint:"شاعیر، بیرمەند و وەرگێڕی کورد؛ دوکتۆرا لە فەلسەفە لە سوید؛ خاوەنی چەندین دیوانی شیعری مۆدێرن و لێکۆڵینەوەی ڕەخنەیی",difficulty:"hard"},{name:"فەرهاد پیرباڵ",latin:"Farhad Pirbal",hint:"نووسەر، شاعیر و وێنەکێش؛ مامۆستای زانکۆی سەڵاحەدین؛ دکتۆرا لە ئەدەبی کوردی لە سۆربۆنی پاریس",difficulty:"hard"},{name:"شێرزاد حەسەن",latin:"Sherzad Hassan",hint:"ڕۆماننووسی کورد لە فینلاند؛ بە بابەتە ڕادیکاڵەکان و ڕەخنە لە پیاوسالاری ناسراوە؛ یەکێکە لە دەنگە جیاوازەکانی ڕۆمانی کوردی",difficulty:"hard"},{name:"عەتا نەهایی",latin:"Ata Nahai",hint:"ڕۆماننووسی کورد لە بانە؛ ڕۆمانی گوڵی شۆڕان؛ لە ناوداری ڕۆمانی کوردی ڕۆژهەڵات",difficulty:"hard"},{name:"جان دۆست",latin:"Jan Dost",hint:"ڕۆماننووس و وەرگێڕی کورد لە کۆبانێ؛ ڕۆمانی «مێرنامە»؛ لە ئەڵمانیا دەژی",difficulty:"hard"},{name:"فرات جەوەری",latin:"Firat Cewerî",hint:"نووسەر و وەرگێڕی کورمانجی؛ گۆڤاری نودەمی دەرکرد؛ لە سوید دەژی",difficulty:"hard"},{name:"حەلیم یووسڤ",latin:"Helîm Yûsiv",hint:"ڕۆماننووسی کورمانجی لە ڕۆژئاڤا؛ پارێزەر بە پیشە؛ لە ئەڵمانیا دەژی",difficulty:"hard"},{name:"سەلیم بەرەکات",latin:"Salim Barakat",hint:"شاعیر و ڕۆماننووسی کوردی قامیشلۆ کە بە عەرەبی دەنووسێت؛ یەکێکە لە دەنگە بەرزەکانی ئەدەبیاتی هاوچەرخ لە جیهانی عەرەبیدا",difficulty:"hard"},{name:"چۆمان هەردی",latin:"Choman Hardi",hint:"شاعیر و توێژەری کورد؛ دامەزرێنەری سەنتەری توێژینەوەی ڕەگەزی لە زانکۆی ئەمریکی سلێمانی؛ کتێبی لێکۆڵینەوە لەسەر ژنانی ڕزگاربووی ئەنفال",difficulty:"hard"},{name:"مەریوان وریا قانع",latin:"Mariwan Wrya Qani",hint:"نووسەر و بیرمەندی کورد؛ لێکۆڵینەوە لە فەلسەفە و کۆمەڵناسی؛ مامۆستای زانکۆ",difficulty:"hard"},{name:"فەرهاد شاکەلی",latin:"Farhad Shakely",hint:"شاعیر و توێژەری کورد لە زانکۆی ئوپسالای سوید؛ لێکۆڵینەوە لەسەر مەم و زینی ئەحمەدی خانی",difficulty:"hard"},{name:"یەلماز گونەی",latin:"Yılmaz Güney",hint:"ئەکتەر و دەرهێنەری کورد
